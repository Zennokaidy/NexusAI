<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NexusAI - Chat</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="highlight-theme">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        :root {
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            --transition-speed: 0.625s ease;
            --sidebar-width: 280px;
            --header-height: 56px;
            
            --bg-color: #0d0d0d;
            --text-color: #d4d4d4;
            --primary-color: #4060ff;
            --primary-color-rgb: 64, 96, 255;
            --secondary-color: #888888;
            --card-bg: #141414;
            --input-bg: #1a1a1a;
            --input-border: #1a1a1a;
            --button-bg: #4060ff;
            --button-text: #ffffff;
            --button-hover-bg: #5070ff;
            --error-color: #f44336;
            --warning-color: #ffca28;
            --code-bg: #0d0d0d;
            --border-color: #222222;
            --shadow-color: rgba(0, 0, 0, 0.6);
            --user-bubble-bg: #4060ff;
            --user-bubble-text: #ffffff;
            --model-bubble-bg: #1a1a1a;
            --copy-button-bg: rgba(160, 160, 160, 0.15);
            --copy-button-hover-bg: rgba(160, 160, 160, 0.3);
            --copy-button-text: var(--secondary-color);
            --copy-button-copied-bg: #34c759;
            --copy-button-copied-text: #111;
            --download-button-bg: rgba(160, 160, 160, 0.15);
            --download-button-hover-bg: rgba(160, 160, 160, 0.3);
            --download-button-text: var(--secondary-color);
            --timestamp-color: #666;
            --input-container-bg: #141414;
            --pill-bg: #222222;
            --pill-hover-bg: #333333;
            --header-bg: #0d0d0d;
            --sidebar-bg: #111111;
            --sidebar-hover: #1a1a1a;
            --active-conversation: #1a1a1a;
            --scrollbar-track: transparent;
            --scrollbar-thumb: #333333;
            --scrollbar-thumb-hover: #444444;
            --border-radius: 10px;
            --bubble-radius: 14px;
            --delete-btn-color: #888;
            --delete-btn-hover: #f44336;
            --model-badge-bg: #1a1a1a;
            --model-badge-text: #888888;
        }

        html[data-theme='light'] {
            --bg-color: #f0f2f5;
            --text-color: #1a1a1a;
            --primary-color: #4060ff;
            --primary-color-rgb: 64, 96, 255;
            --secondary-color: #6c757d;
            --card-bg: #ffffff;
            --input-bg: #ffffff;
            --input-border: #e0e0e0;
            --button-bg: #4060ff;
            --button-text: #ffffff;
            --button-hover-bg: #5070ff;
            --error-color: #dc3545;
            --warning-color: #ffc107;
            --code-bg: #f5f5f5;
            --border-color: #e0e0e0;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --user-bubble-bg: #4060ff;
            --user-bubble-text: #ffffff;
            --model-bubble-bg: #f8f9fa;
            --copy-button-bg: rgba(108, 117, 125, 0.1);
            --copy-button-hover-bg: rgba(108, 117, 125, 0.2);
            --copy-button-text: var(--secondary-color);
            --copy-button-copied-bg: #28a745;
            --copy-button-copied-text: #ffffff;
            --download-button-bg: rgba(108, 117, 125, 0.1);
            --download-button-hover-bg: rgba(108, 117, 125, 0.2);
            --download-button-text: var(--secondary-color);
            --timestamp-color: #999;
            --input-container-bg: #ffffff;
            --pill-bg: #e9ecef;
            --pill-hover-bg: #dee2e6;
            --header-bg: #ffffff;
            --sidebar-bg: #f8f9fa;
            --sidebar-hover: #e9ecef;
            --active-conversation: #e9ecef;
            --scrollbar-thumb: #ccc;
            --scrollbar-thumb-hover: #aaa;
            --delete-btn-color: #999;
            --delete-btn-hover: #dc3545;
            --model-badge-bg: #e9ecef;
            --model-badge-text: #6c757d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            transition: background-color var(--transition-speed), color var(--transition-speed);
            display: flex;
            height: 100%;
            width: 100%;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }

        .sidebar {
            width: var(--sidebar-width);
            height: 100%;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform var(--transition-speed);
            z-index: 50;
            transform: translateX(-100%);
            position: fixed;
        }

        .sidebar.open {
            transform: translateX(0);
            position: relative;
        }

        .sidebar-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: var(--header-height);
            flex-shrink: 0;
        }

        .sidebar-header h2 {
            font-size: 1em;
            font-weight: 600;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sidebar-header h2 svg {
            width: 20px;
            height: 20px;
            color: var(--primary-color);
        }

        .new-chat-btn {
            background: var(--primary-color);
            color: var(--button-text);
            border: none;
            border-radius: 6px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 0.75em;
            font-weight: 500;
            transition: background var(--transition-speed);
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .new-chat-btn:hover {
            background: var(--button-hover-bg);
        }

        .new-chat-btn svg {
            width: 14px;
            height: 14px;
        }

        .search-container {
            padding: 8px 14px;
            border-bottom: 1px solid var(--border-color);
        }

        .search-input {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 0.8em;
            transition: border-color var(--transition-speed);
        }

        .search-input:focus {
            border-color: var(--primary-color);
        }

        .search-input::placeholder {
            color: var(--secondary-color);
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 10px 6px 14px;
        }

        .conversation-item {
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background var(--transition-speed);
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            color: var(--text-color);
            font-size: 0.85em;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }

        .conversation-item:hover {
            background: var(--sidebar-hover);
        }

        .conversation-item.active {
            background: var(--active-conversation);
            font-weight: 500;
        }

        .conversation-item .convo-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .conversation-item .convo-menu-trigger {
            opacity: 0.4;
            transition: opacity var(--transition-speed);
            background: transparent;
            border: none;
            color: var(--delete-btn-color);
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .conversation-item:hover .convo-menu-trigger {
            opacity: 1;
        }

        .conversation-item .convo-menu-trigger:hover {
            background: rgba(128, 128, 128, 0.1);
        }

        .conversation-item .convo-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 4px 20px var(--shadow-color);
            z-index: 100;
            min-width: 130px;
            overflow: hidden;
        }

        .conversation-item .convo-dropdown.open {
            display: block;
        }

        .conversation-item .convo-dropdown button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: transparent;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 0.8em;
            width: 100%;
            text-align: left;
            transition: background var(--transition-speed);
        }

        .conversation-item .convo-dropdown button:hover {
            background: var(--sidebar-hover);
        }

        .conversation-item .convo-dropdown button.danger {
            color: var(--error-color);
        }

        .conversation-item .convo-dropdown button svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        .sidebar-footer {
            padding: 12px 18px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
            margin-top: auto;
        }

        .sidebar-footer .footer-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 10px;
            color: var(--text-color);
            cursor: pointer;
            font-size: 0.8em;
            transition: all var(--transition-speed);
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        .sidebar-footer .footer-btn:hover {
            background: var(--sidebar-hover);
        }

        .sidebar-footer .footer-btn svg {
            width: 16px;
            height: 16px;
        }

        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .chat-header {
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 0 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: var(--header-height);
            flex-shrink: 0;
            position: relative;
            z-index: 5;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-toggle {
            display: flex;
            background: transparent;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            padding: 4px;
        }

        .sidebar-toggle svg {
            width: 20px;
            height: 20px;
        }

        .chat-header h1 {
            font-size: 1em;
            font-weight: 600;
            color: var(--text-color);
        }

        .chat-header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            position: relative;
        }

        .header-action-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 4px 10px;
            color: var(--text-color);
            cursor: pointer;
            font-size: 0.8em;
            transition: all var(--transition-speed);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .header-action-btn:hover {
            background: var(--pill-bg);
        }

        .header-action-btn svg {
            width: 14px;
            height: 14px;
        }

        .model-badge {
            font-size: 0.7em;
            background: var(--model-badge-bg);
            color: var(--model-badge-text);
            padding: 3px 10px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all var(--transition-speed);
            display: flex;
            align-items: center;
            gap: 3px;
            position: relative;
        }

        .model-badge:hover {
            background: var(--pill-bg);
        }

        .model-badge .badge-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            display: inline-block;
        }

        .model-badge .badge-dot.fast {
            background: #34c759;
        }

        .model-badge .badge-dot.reasoning {
            background: #ff9500;
        }

        .model-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 0 4px 20px var(--shadow-color);
            z-index: 200;
            min-width: 180px;
            max-height: 280px;
            overflow-y: auto;
            padding: 4px;
        }

        .model-dropdown.open {
            display: block;
        }

        .model-dropdown .model-option-dropdown {
            display: flex;
            flex-direction: column;
            padding: 8px 12px;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: var(--text-color);
            cursor: pointer;
            width: 100%;
            text-align: left;
            font-size: 0.8em;
            transition: background var(--transition-speed);
        }

        .model-dropdown .model-option-dropdown:hover {
            background: var(--sidebar-hover);
        }

        .model-dropdown .model-option-dropdown.active {
            background: var(--primary-color);
            color: var(--button-text);
        }

        .model-dropdown .model-option-dropdown .model-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .model-dropdown .model-option-dropdown .model-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .model-dropdown .model-option-dropdown .model-dot.fast {
            background: #34c759;
        }

        .model-dropdown .model-option-dropdown .model-dot.reasoning {
            background: #ff9500;
        }

        .model-dropdown .model-option-dropdown .model-label {
            flex: 1;
            font-weight: 500;
        }

        .model-dropdown .model-option-dropdown .model-check {
            opacity: 0;
        }

        .model-dropdown .model-option-dropdown.active .model-check {
            opacity: 1;
        }

        .model-dropdown .model-option-dropdown .model-desc {
            font-size: 0.7em;
            opacity: 0.5;
            margin-left: 14px;
            margin-top: 1px;
        }

        .model-dropdown .model-option-dropdown.active .model-desc {
            opacity: 0.7;
        }

        .model-dropdown .model-option-dropdown .model-tokens {
            font-size: 0.6em;
            opacity: 0.4;
            margin-left: 14px;
            margin-top: 1px;
        }

        .model-dropdown .model-option-dropdown.active .model-tokens {
            opacity: 0.6;
        }

        .streaming-indicator {
            display: inline-block;
            animation: blink 1s step-start 0s infinite;
            opacity: 0.7;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }

        .chat-container {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 16px 0 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            min-height: 0;
            height: 100%;
        }

        .chat-content {
            width: 100%;
            max-width: 820px;
            padding: 0 20px;
        }

        .chat-placeholder {
            text-align: center;
            color: var(--secondary-color);
            font-size: 1.3em;
            margin-top: 60px;
        }

        .scroll-to-bottom {
            position: absolute;
            bottom: 110px;
            left: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 12px var(--shadow-color);
            transition: all var(--transition-speed);
            opacity: 0;
            pointer-events: none;
            z-index: 20;
        }

        .scroll-to-bottom.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .scroll-to-bottom:hover {
            transform: scale(1.05);
            background: var(--pill-bg);
        }

        .scroll-to-bottom svg {
            width: 20px;
            height: 20px;
            color: var(--text-color);
        }

        .message-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .message-group.user { align-items: flex-end; }
        .message-group.model { align-items: flex-start; }

        .message-header {
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin-bottom: 3px;
            padding: 0 10px;
            font-size: 0.7em;
        }

        .message-group.user .message-header { flex-direction: row-reverse; }

        .message-author {
            font-weight: 600;
            color: var(--text-color);
        }

        .message-timestamp {
            color: var(--timestamp-color);
            font-size: 0.9em;
        }

        .message-actions {
            display: flex;
            gap: 6px;
            margin-top: 4px;
            padding: 0 10px;
        }

        .message-actions .msg-action-btn {
            background: transparent;
            border: none;
            color: var(--secondary-color);
            cursor: pointer;
            font-size: 0.7em;
            padding: 2px 8px;
            border-radius: 4px;
            transition: all var(--transition-speed);
        }

        .message-actions .msg-action-btn:hover {
            background: var(--pill-bg);
            color: var(--text-color);
        }

        .message-actions .msg-action-btn.edit-btn:hover {
            color: var(--primary-color);
        }

        .message-actions .msg-action-btn.delete-btn:hover {
            color: var(--error-color);
        }

        .chat-bubble {
            padding: 10px 14px;
            border-radius: var(--bubble-radius);
            max-width: 85%;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 0.95em;
            position: relative;
        }

        .user-bubble {
            background-color: var(--user-bubble-bg);
            color: var(--user-bubble-text);
            border-bottom-right-radius: 3px;
        }

        .model-bubble {
            background-color: var(--model-bubble-bg);
            color: var(--text-color);
            border-bottom-left-radius: 3px;
            border: 1px solid var(--border-color);
        }

        .edit-mode .user-bubble {
            border: 2px solid var(--primary-color);
            padding: 8px 12px;
        }

        .edit-mode .user-bubble textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--user-bubble-text);
            font-family: var(--font-family);
            font-size: 0.95em;
            resize: vertical;
            min-height: 40px;
            outline: none;
        }

        .edit-mode .user-bubble .edit-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            justify-content: flex-end;
        }

        .edit-mode .user-bubble .edit-actions button {
            padding: 4px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: 500;
            transition: all var(--transition-speed);
        }

        .edit-mode .user-bubble .edit-actions .save-edit {
            background: var(--primary-color);
            color: var(--button-text);
        }

        .edit-mode .user-bubble .edit-actions .save-edit:hover {
            background: var(--button-hover-bg);
        }

        .edit-mode .user-bubble .edit-actions .cancel-edit {
            background: var(--pill-bg);
            color: var(--text-color);
        }

        .edit-mode .user-bubble .edit-actions .cancel-edit:hover {
            background: var(--pill-hover-bg);
        }

        .user-images-container {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 6px;
            justify-content: flex-end;
        }

        .user-images-container img {
            max-width: 120px;
            max-height: 120px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid var(--border-color);
        }

        .file-preview {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding: 4px 0;
        }

        .file-preview .preview-item {
            position: relative;
            display: inline-block;
        }

        .file-preview .preview-item img {
            max-width: 60px;
            max-height: 60px;
            border-radius: 6px;
            object-fit: cover;
            border: 2px solid var(--border-color);
        }

        .file-preview .preview-item .remove-file {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--error-color);
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .file-preview .preview-item .remove-file:hover {
            transform: scale(1.1);
        }

        .model-bubble h1, .model-bubble h2, .model-bubble h3 { 
            margin-top: 0.6em; 
            margin-bottom: 0.3em; 
            font-weight: 600; 
        }
        .model-bubble h1 { font-size: 1.3em; } 
        .model-bubble h2 { font-size: 1.1em; } 
        .model-bubble h3 { font-size: 1em; }
        .model-bubble p { margin-bottom: 0.6em; }
        .model-bubble ul, .model-bubble ol { 
            margin-left: 18px; 
            margin-bottom: 0.6em; 
        }
        .model-bubble li { margin-bottom: 0.2em; }
        .model-bubble blockquote { 
            border-left: 3px solid var(--primary-color); 
            padding-left: 10px; 
            margin: 0.6em 0; 
            color: var(--secondary-color); 
            font-style: italic; 
        }
        .model-bubble pre {
            background-color: var(--code-bg);
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            margin: 6px 0;
            position: relative;
            padding-top: 30px;
        }
        .model-bubble pre code {
            background-color: transparent;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;

        .icon-btn:active {

        .icon-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;

        .send-btn {
            background-color: var(--primary-color);

            border-radius: 50%;

            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;

            outline: none;
            box-shadow: none;

        .send-btn:disabled {

        .send-btn svg {
            width: 16px;
            height: 16px;

        .bottom-actions {

            gap: 8px;

        .file-btn {

            gap: 5px;

            color: var(--text-color);

            font-weight: 500;
            cursor: pointer;

            box-shadow: none;
            -webkit-tap-highlight-color: transparent;
        }

        .file-btn:hover {
            background-color: var(--pill-hover-bg);
        }

        .file-btn:active {

        }

        .file-btn svg {

            height: 14px;
            fill: currentColor;
            stroke: none;
        }

        .input-container {

            bottom: 0;
            width: 100%;
            padding: 0 20px 16px 20px;
            background: var(--bg-color);

        @media (max-width: 768px) {

            .file-btn {

                height: 30px;

            .send-btn svg {
                width: 14px;
                height: 14px;
            }
            
            .icon-btn {

                height: 28px;
            }
            
            .icon-btn svg {
                width: 14px;
                height: 14px;
            }
            
            .chat-input-container {
                padding: 8px 12px 6px 12px;

            }
            
            .input-area {

            }
            
            .header-action-btn span {

            }
            
            .model-badge {

            }

        @media (max-width: 480px) {

            .message-header {

                padding: 14px;
            }

            .chat-input-container {

                border-radius: 10px;
                gap: 6px;
            }

                font-size: 13px;
                min-height: 18px;
            }
            
            .send-btn {
                width: 28px;
                height: 28px;
            }
            
            .send-btn svg {
                width: 12px;
                height: 12px;
            }
            
            .icon-btn {
                width: 26px;
                height: 26px;
            }
            
            .icon-btn svg {
                width: 12px;
                height: 12px;
            }
            
            .action-row {
                gap: 8px;
            }
            
            .file-btn {
                font-size: 9px;
                padding: 2px 6px;
            }
            
            .file-btn svg {
                width: 10px;
                height: 10px;
            }
            
            .user-images-container img {
                max-width: 60px;
                max-height: 60px;
            }
            
            .file-preview .preview-item img {
                max-width: 40px;
                max-height: 40px;
            }
            
            .model-dropdown {
                min-width: 140px;
            }
            
            .chat-container {
                padding: 10px 0 90px 0;
            }
            
            .scroll-to-bottom {
                bottom: 90px;
                left: 10px;
                width: 32px;
                height: 32px;
            }
            
            .scroll-to-bottom svg {
                width: 16px;
                height: 16px;
            }
        }

        input[type="file"] { display: none; }

        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-speed);
            backdrop-filter: blur(4px);
        }

        .settings-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .settings-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            width: 90%;
            max-width: 420px;
            max-height: 85vh;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            z-index: 201;
            overflow-y: auto;
            padding: 24px 28px;
            box-shadow: 0 8px 40px var(--shadow-color);
            opacity: 0;
            pointer-events: none;
            transition: all var(--transition-speed);
        }

        .settings-panel.open {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
        }

        .settings-header h2 {
            font-size: 1.2em;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-header h2 svg {
            width: 20px;
            height: 20px;
            color: var(--primary-color);
        }

        .close-settings {
            cursor: pointer;
            padding: 4px 8px;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 1.4em;
            line-height: 1;
            transition: color var(--transition-speed);
        }

        .close-settings:hover {
            color: var(--error-color);
        }

        .settings-group {
            margin-bottom: 16px;
        }

        .settings-group label {
            display: block;
            margin-bottom: 4px;
            font-weight: 500;
            font-size: 0.85em;
            color: var(--text-color);
        }

        .settings-group select {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 0.9em;
            transition: border-color var(--transition-speed);
        }

        .settings-group select:focus {

        .settings-divider {

        }

        .auth-tabs {

            gap: 6px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .auth-tab {
            padding: 6px 14px;

            border: none;
            border-bottom: 2px solid transparent;

            font-weight: 500;
            font-size: 0.85em;
            transition: all var(--transition-speed);
        }

        .auth-tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .auth-tab:hover {
            color: var(--text-color);

        .auth-form {
            display: none;

            gap: 10px;

        .auth-form.active {
            display: flex;
        }

        .auth-form input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 0.9em;
            transition: border-color var(--transition-speed);
        }

        .auth-form input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .auth-form .auth-btn {
            padding: 8px;
            background: var(--primary-color);
            color: var(--button-text);
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background var(--transition-speed);
            font-size: 0.9em;
        }

        .auth-form .auth-btn:hover {
            background: var(--button-hover-bg);
        }

        .auth-form .auth-error {
            color: var(--error-color);
            font-size: 0.8em;
            text-align: center;
            min-height: 18px;
        }

        .auth-divider {
            text-align: center;
            color: var(--secondary-color);
            font-size: 0.8em;
            padding: 2px 0;
        }

        .social-login {
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }

        .social-btn {
            padding: 8px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: transparent;
            color: var(--text-color);
            cursor: pointer;
            font-size: 0.85em;
            transition: all var(--transition-speed);
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            width: 100%;
        }

        .social-btn:hover {
            background: var(--pill-bg);
        }

        .social-btn svg {
            width: 20px;
            height: 20px;
        }

        .auth-logged-in {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            background: var(--pill-bg);

        }

        .auth-logged-in .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .auth-logged-in .user-avatar {

            height: 28px;
            border-radius: 50%;
            background: var(--primary-color);
            color: #fff;

            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.8em;
        }

        .auth-logged-in .logout-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 3px 10px;
            color: var(--text-color);
            cursor: pointer;
            font-size: 0.75em;
            transition: all var(--transition-speed);
        }

        .auth-logged-in .logout-btn:hover {
            background: var(--error-color);
            color: #fff;
            border-color: var(--error-color);
        }

        #status {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 14px;
            display: none;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 16px var(--shadow-color);
            z-index: 1000;
            font-size: 0.85em;
        }

        #status.show { display: flex; }
        #status.error { border-color: var(--error-color); color: var(--error-color); }
        #status.warning { border-color: var(--warning-color); color: var(--warning-color); }

</head>
