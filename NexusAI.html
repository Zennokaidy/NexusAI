            <div style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="settingsRemember">
                <label for="settingsRemember" style="margin: 0; font-size: 0.85em;">Remember settings</label>
            </div>
        </div>
    </div>

    <div id="status"></div>

    <input type="file" id="fileInput" accept="image/*,application/pdf,audio/*,video/*,text/*" multiple>
    <input type="file" id="loadChatInput" accept=".json">

    <script>
        (function() {
            'use strict';

            const API_KEYS = [
                "AQ" + ".Ab8RN6JFVu" + "929TX9azg" + "uz_9cjP0kBYp" + "8nkO4HMTY" + "bb4TrUzXCg",
                "AQ" + ".Ab8RN6J8c_" + "jzNaM5lhI" + "HD4dDXcIx1bp" + "9C2D_NQwq" + "8l8IPP3pqA",
                "AQ" + ".Ab8RN6K6T-" + "DYacezqAP" + "NoJb0z_hLrAT" + "Yo01jDBmx" + "lfr2lEk7vw",
                "AQ" + ".Ab8RN6L-DV" + "HHB7_T-gk" + "c1tVOu7PJo9M" + "GaeYUvmeu" + "jx0SlsKCAw",
                "AQ" + ".Ab8RN6INRn" + "RXWM4Kc-E" + "vGyd43gIZ3FO" + "g_VlXaFAU" + "b_UH3l-7Mg"
            ];

            const MODELS = {
                'gemini-3.5-flash-lite': {
                    name: 'Gemini 3.5 Flash Lite',
                    modelId: 'gemini-3.5-flash-lite',
                    display: 'Flash Lite',
                    dot: 'fast',
                    desc: 'Fast & Reasoning',
                    maxOutputTokens: 66000,
                    maxInputTokens: 1000000
                },
                'gemini-3.7-flash': {
                    name: 'Gemini 3.7 Flash',
                    modelId: 'gemini-3.7-flash',
                    display: 'Ultimate',
                    dot: 'fast',
                    desc: 'Ultimate',
                    maxOutputTokens: 65536,
                    maxInputTokens: 1000000
                },
                'gemini-3.5-flash': {
                    name: 'Gemini 3.5 Flash',
                    modelId: 'gemini-3.5-flash',
                    display: 'Pro Reasoning Flash',
                    dot: 'reasoning',
                    desc: 'Deep Reasoning',
                    maxOutputTokens: 64000,
                    maxInputTokens: 1000000
                }
            };

            const elements = {
                sidebar: document.getElementById('sidebar'),
                sidebarToggle: document.getElementById('sidebarToggle'),
                conversationsList: document.getElementById('conversationsList'),
                newChatBtn: document.getElementById('newChatBtn'),
                settingsFooterBtn: document.getElementById('settingsFooterBtn'),
                chatTitle: document.getElementById('chatTitle'),
                chatContainer: document.getElementById('chatContainer'),
                chatContent: document.getElementById('chatContent'),
                prompt: document.getElementById('prompt'),
                sendButton: document.getElementById('sendButton'),
                uploadBtn: document.getElementById('uploadBtn'),
                fileInput: document.getElementById('fileInput'),
                filePreview: document.getElementById('filePreview'),
                saveChatBtn: document.getElementById('saveChatBtn'),
                loadChatBtn: document.getElementById('loadChatBtn'),
                loadChatInput: document.getElementById('loadChatInput'),
                scrollToBottomBtn: document.getElementById('scrollToBottomBtn'),
                themeToggleBtn: document.getElementById('themeToggleBtn'),
                themeLabel: document.getElementById('themeLabel'),
                settingsOverlay: document.getElementById('settingsOverlay'),
                settingsPanel: document.getElementById('settingsPanel'),
                closeSettingsBtn: document.getElementById('closeSettingsBtn'),
                settingsTheme: document.getElementById('settingsTheme'),
                settingsRemember: document.getElementById('settingsRemember'),
                modelBadge: document.getElementById('modelBadge'),
                modelBadgeText: document.getElementById('modelBadgeText'),
                modelDot: document.getElementById('modelDot'),
                modelDropdown: document.getElementById('modelDropdown'),
                authContainer: document.getElementById('authContainer'),
                statusDiv: document.getElementById('status'),
                searchInput: document.getElementById('searchInput'),
            };

            let state = {
                conversations: [],
                activeConversationId: null,
                currentMessages: [],
                selectedFiles: [],
                isStreaming: false,
                settings: {
                    theme: 'dark',
                    model: 'gemini-3.5-flash-lite',
                    remember: false,
                },
                user: null,
                pinnedConversations: [],
                searchQuery: '',
                apiKeyIndex: 0,
                editingMessageIndex: null,
                isUserScrolling: false,
                autoScrollEnabled: true,
            };

            let statusTimer = null;
            let conversationIdCounter = 0;
            let scrollTimeout = null;

            const authDB = {
                users: JSON.parse(localStorage.getItem('nexusai_users') || '{}'),
                sessions: JSON.parse(localStorage.getItem('nexusai_sessions') || '{}'),
                
                save() {
                    localStorage.setItem('nexusai_users', JSON.stringify(this.users));
                    localStorage.setItem('nexusai_sessions', JSON.stringify(this.sessions));
                },
                
                register(email, password, name) {
                    const key = email.toLowerCase();
                    if (this.users[key]) return { error: 'Email already registered' };
                    const user = {
                        id: 'user_' + Date.now(),
                        email: email,
                        name: name || email.split('@')[0],
                        password: password,
                        provider: 'local',
                        createdAt: new Date().toISOString(),
                    };
                    this.users[key] = user;
                    this.save();
                    return { success: true, user };
                },
                
                login(email, password) {
                    const key = email.toLowerCase();
                    const user = this.users[key];
                    if (!user) return { error: 'User not found' };
                    if (user.provider === 'local' && user.password !== password) {
                        return { error: 'Invalid password' };
                    }
                    const sessionId = 'sess_' + Date.now();
                    this.sessions[sessionId] = { userId: user.id, email: user.email, createdAt: new Date().toISOString() };
                    this.save();
                    return { success: true, user, sessionId };
                },
                
                loginWithProvider(provider, email, name) {
                    const key = email.toLowerCase();
                    let user = this.users[key];
                    if (!user) {
                        user = {
                            id: 'user_' + Date.now(),
                            email: email,
                            name: name || email.split('@')[0],
                            password: '',
                            provider: provider,
                            createdAt: new Date().toISOString(),
                        };
                        this.users[key] = user;
                    }
                    const sessionId = 'sess_' + Date.now();
                    this.sessions[sessionId] = { userId: user.id, email: user.email, provider: provider, createdAt: new Date().toISOString() };
                    this.save();
                    return { success: true, user, sessionId };
                },
                
                logout(sessionId) {
                    delete this.sessions[sessionId];
                    this.save();
                }
            };

            function getApiKey() {
                return API_KEYS[state.apiKeyIndex % API_KEYS.length];
            }

            function rotateApiKey() {
                state.apiKeyIndex = (state.apiKeyIndex + 1) % API_KEYS.length;
                return getApiKey();
            }

            function generateId() {
                return 'conv_' + (++conversationIdCounter) + '_' + Date.now().toString(36);
            }

            function formatTimestamp(date) {
                const hours = date.getHours();
                const minutes = date.getMinutes();
                const ampm = hours >= 12 ? 'PM' : 'AM';
                const displayHours = hours % 12 || 12;
                return displayHours + ':' + minutes.toString().padStart(2, '0') + ' ' + ampm;
            }

            function escapeHtml(unsafe) {
                if (typeof unsafe !== 'string') return '';
                return unsafe
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            function getConversationTitle(messages) {
                if (!messages || messages.length === 0) return 'New Conversation';
                const firstUserMsg = messages.find(m => m.role === 'user');
                if (firstUserMsg) {
                    const text = firstUserMsg.parts.find(p => p.text)?.text || '';
                    return text.slice(0, 40) + (text.length > 40 ? '...' : '');
                }
                return 'New Conversation';
            }

            function getStorageKey() {
                if (state.user) {
                    return 'nexusai_data_' + state.user.id;
                }
                return 'nexusai_data_guest';
            }

            function loadData() {
                try {
                    const key = getStorageKey();
                    const data = JSON.parse(localStorage.getItem(key) || 'null');
                    if (data) {
                        state.conversations = data.conversations || [];
                        state.activeConversationId = data.activeConversationId || null;
                        state.currentMessages = data.currentMessages || [];
                        state.pinnedConversations = data.pinnedConversations || [];
                        if (data.settings) {
                            Object.assign(state.settings, data.settings);
                        }
                        if (data.apiKeyIndex !== undefined) {
                            state.apiKeyIndex = data.apiKeyIndex;
                        }
                        return true;
                    }
                } catch (e) {}
                return false;
            }

            function saveData() {
                try {
                    const key = getStorageKey();
                    const data = {
                        conversations: state.conversations,
                        activeConversationId: state.activeConversationId,
                        currentMessages: state.currentMessages,
                        pinnedConversations: state.pinnedConversations,
                        settings: state.settings,
                        apiKeyIndex: state.apiKeyIndex,
                    };
                    localStorage.setItem(key, JSON.stringify(data));
                } catch (e) {}
            }

            function setTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                state.settings.theme = theme;
                elements.settingsTheme.value = theme;
                elements.themeLabel.textContent = theme === 'dark' ? 'Dark' : 'Light';
                localStorage.setItem('nexusai-theme', theme);
                
                const lightUrl = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css';
                const darkUrl = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css';
                document.getElementById('highlight-theme').href = theme === 'dark' ? darkUrl : lightUrl;
            }

            function toggleTheme() {
                const current = document.documentElement.getAttribute('data-theme') || 'dark';
                setTheme(current === 'dark' ? 'light' : 'dark');
            }

            function showStatus(message, isError, isWarning) {
                clearTimeout(statusTimer);
                elements.statusDiv.textContent = message;
                elements.statusDiv.className = 'show';
                if (isError) elements.statusDiv.classList.add('error');
                if (isWarning) elements.statusDiv.classList.add('warning');
                statusTimer = setTimeout(function() {
                    elements.statusDiv.classList.remove('show');
                }, 4000);
            }

            function hideStatus() {
                elements.statusDiv.classList.remove('show');
            }

            function setModel(modelKey) {
                state.settings.model = modelKey;
                const model = MODELS[modelKey];
                if (model) {
                    elements.modelBadgeText.textContent = model.display;
                    elements.modelDot.className = 'badge-dot ' + model.dot;
                }
                
                document.querySelectorAll('.model-option-dropdown').forEach(function(btn) {
                    btn.classList.toggle('active', btn.dataset.model === modelKey);
                });
                
                saveData();
                closeModelDropdown();
            }

            function getCurrentModelId() {
                const model = MODELS[state.settings.model];
                return model ? model.modelId : 'gemini-3.5-flash-lite';
            }

            function toggleModelDropdown() {
                elements.modelDropdown.classList.toggle('open');
            }

            function closeModelDropdown() {
                elements.modelDropdown.classList.remove('open');
            }

            function renderAuth() {
                if (state.user) {
                    elements.authContainer.innerHTML = `
                        <div class="auth-logged-in">
                            <div class="user-info">
                                <div class="user-avatar">${state.user.name.charAt(0).toUpperCase()}</div>
                                <div>
                                    <div style="font-weight: 500;">${state.user.name}</div>
                                    <div style="font-size: 0.75em; color: var(--secondary-color);">${state.user.email}</div>
                                </div>
                            </div>
                            <button class="logout-btn" id="logoutBtn">Logout</button>
                        </div>
                    `;
                    document.getElementById('logoutBtn').addEventListener('click', handleLogout);
                    return;
                }

                elements.authContainer.innerHTML = `
                    <div style="margin-bottom: 8px; font-size: 0.8em; color: var(--secondary-color); text-align: center;">
                        Create an account to save conversations
                    </div>
                    <div class="auth-tabs">
                        <button class="auth-tab active" data-tab="login">Login</button>
                        <button class="auth-tab" data-tab="register">Register</button>
                    </div>
                    
                    <div class="auth-form active" id="loginForm">
                        <input type="email" id="loginEmail" placeholder="Email" />
                        <input type="password" id="loginPassword" placeholder="Password" />
                        <div class="auth-error" id="loginError"></div>
                        <button class="auth-btn" id="loginBtn">Login</button>
                        
                        <div class="auth-divider">or continue with</div>
                        
                        <div class="social-login">
                            <button class="social-btn" data-provider="google">
                                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z"/></svg>
                                Google
                            </button>
                            <button class="social-btn" data-provider="microsoft">
                                <svg viewBox="0 0 24 24"><path fill="#f25022" d="M11.4 11.4H0V0h11.4v11.4z"/><path fill="#7fba00" d="M24 11.4H12.6V0H24v11.4z"/><path fill="#00a4ef" d="M11.4 24H0V12.6h11.4V24z"/><path fill="#ffb900" d="M24 24H12.6V12.6H24V24z"/></svg>
                                Microsoft
                            </button>
                        </div>
                    </div>
                    
                    <div class="auth-form" id="registerForm">
                        <input type="text" id="registerName" placeholder="Full Name" />
                        <input type="email" id="registerEmail" placeholder="Email" />
                        <input type="password" id="registerPassword" placeholder="Password" />
                        <div class="auth-error" id="registerError"></div>
                        <button class="auth-btn" id="registerBtn">Create Account</button>
                    </div>
                `;

                document.querySelectorAll('.auth-tab').forEach(function(tab) {
                    tab.addEventListener('click', function() {
                        document.querySelectorAll('.auth-tab').forEach(function(t) { t.classList.remove('active'); });
                        this.classList.add('active');
                        document.querySelectorAll('.auth-form').forEach(function(f) { f.classList.remove('active'); });
                        document.getElementById(this.dataset.tab + 'Form').classList.add('active');
                    });
                });

                document.getElementById('loginBtn').addEventListener('click', function() {
                    const email = document.getElementById('loginEmail').value.trim();
                    const password = document.getElementById('loginPassword').value;
                    const errorEl = document.getElementById('loginError');
                    errorEl.textContent = '';
                    if (!email || !password) {
                        errorEl.textContent = 'Please fill in all fields';
                        return;
                    }
                    const result = authDB.login(email, password);
                    if (result.error) {
                        errorEl.textContent = result.error;
                        return;
                    }
                    state.user = result.user;
                    renderAuth();
                    loadData();
                    renderConversations();
                    renderMessages();
                    updateTitle();
                    updateSendButton();
                    applySettings();
                    showStatus('Welcome back, ' + state.user.name + '!');
                    closeSettings();
                });

                document.getElementById('registerBtn').addEventListener('click', function() {
                    const name = document.getElementById('registerName').value.trim();
                    const email = document.getElementById('registerEmail').value.trim();
                    const password = document.getElementById('registerPassword').value;
                    const errorEl = document.getElementById('registerError');
                    errorEl.textContent = '';
                    if (!name || !email || !password) {
                        errorEl.textContent = 'Please fill in all fields';
                        return;
                    }
                    if (password.length < 6) {
                        errorEl.textContent = 'Password must be at least 6 characters';
                        return;
                    }
                    const result = authDB.register(email, password, name);
                    if (result.error) {
                        errorEl.textContent = result.error;
                        return;
                    }
                    state.user = result.user;
                    renderAuth();
                    loadData();
                    renderConversations();
                    renderMessages();
                    updateTitle();
                    updateSendButton();
                    applySettings();
                    showStatus('Welcome, ' + state.user.name + '!');
                    closeSettings();
                });

                document.querySelectorAll('.social-btn').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        const provider = this.dataset.provider;
                        const email = prompt('Enter your ' + provider + ' email:');
                        if (!email) return;
                        const name = prompt('Enter your name:') || email.split('@')[0];
                        const result = authDB.loginWithProvider(provider, email, name);
                        if (result.error) {
                            alert(result.error);
                            return;
                        }
                        state.user = result.user;
                        renderAuth();
                        loadData();
                        renderConversations();
                        renderMessages();
                        updateTitle();
                        updateSendButton();
                        applySettings();
                        showStatus('Welcome, ' + state.user.name + '!');
                        closeSettings();
                    });
                });

                document.getElementById('loginPassword').addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') document.getElementById('loginBtn').click();
                });
                document.getElementById('registerPassword').addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') document.getElementById('registerBtn').click();
                });
            }

            function handleLogout() {
                state.user = null;
                const key = getStorageKey();
                localStorage.removeItem(key);
                state.conversations = [];
                state.activeConversationId = null;
                state.currentMessages = [];
                state.pinnedConversations = [];
                renderAuth();
                renderConversations();
                renderMessages();
                updateTitle();
                updateSendButton();
                showStatus('Logged out');
            }

            function getFilteredConversations() {
                const query = state.searchQuery.toLowerCase().trim();
                if (!query) return state.conversations;
                
                return state.conversations.filter(function(conv) {
                    const titleMatch = conv.title.toLowerCase().includes(query);
                    const msgMatch = conv.messages.some(function(msg) {
                        const text = msg.parts.map(function(p) { return p.text || ''; }).join('');
                        return text.toLowerCase().includes(query);
                    });
                    return titleMatch || msgMatch;
                });
            }

            function renderConversations() {
                const list = elements.conversationsList;
                list.innerHTML = '';
                
                const filtered = getFilteredConversations();
                
                if (filtered.length === 0) {
                    const empty = document.createElement('div');
                    empty.style.cssText = 'padding: 16px; text-align: center; color: var(--secondary-color); font-size: 0.85em;';
                    empty.textContent = state.searchQuery ? 'No results found' : 'No conversations yet';
                    list.appendChild(empty);
                    return;
                }

                const pinned = filtered.filter(function(c) { return state.pinnedConversations.includes(c.id); });
                const unpinned = filtered.filter(function(c) { return !state.pinnedConversations.includes(c.id); });
                const sorted = pinned.concat(unpinned);

                sorted.forEach(function(conv) {
                    const item = document.createElement('div');
                    item.className = 'conversation-item';
                    if (conv.id === state.activeConversationId) {
                        item.classList.add('active');
                    }
                    
                    const titleSpan = document.createElement('span');
                    titleSpan.className = 'convo-title';
                    if (state.pinnedConversations.includes(conv.id)) {
                        titleSpan.innerHTML = '📌 ' + (conv.title || 'New Conversation');
                    } else {
                        titleSpan.textContent = conv.title || 'New Conversation';
                    }
                    
                    const menuBtn = document.createElement('button');
                    menuBtn.className = 'convo-menu-trigger';
                    menuBtn.innerHTML = '⋮';
                    menuBtn.title = 'Menu';
                    
                    const dropdown = document.createElement('div');
                    dropdown.className = 'convo-dropdown';
                    
                    const renameBtn = document.createElement('button');
                    renameBtn.innerHTML = `
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                        Rename
                    `;
                    renameBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        dropdown.classList.remove('open');
                        renameConversation(conv.id);
                    });
                    
                    const pinBtn = document.createElement('button');
                    const isPinned = state.pinnedConversations.includes(conv.id);
                    pinBtn.innerHTML = isPinned ? `
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 17v-4M8 11h8M12 3L8 7h8l-4-4z"/>
                            <path d="M8 7v8a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V7"/>
                        </svg>
                        Unpin
                    ` : `
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 17v-4M8 11h8M12 3L8 7h8l-4-4z"/>
                            <path d="M8 7v8a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V7"/>
                        </svg>
                        Pin
                    `;
                    pinBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        dropdown.classList.remove('open');
                        togglePinConversation(conv.id);
                    });
                    
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'danger';
                    deleteBtn.innerHTML = `
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/>
                            <path d="M10 11v6M14 11v6"/>
                        </svg>
                        Delete
                    `;
                    deleteBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        dropdown.classList.remove('open');
                        deleteConversation(conv.id);
                    });
                    
                    dropdown.appendChild(renameBtn);
                    dropdown.appendChild(pinBtn);
                    dropdown.appendChild(deleteBtn);
                    
                    menuBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        document.querySelectorAll('.convo-dropdown.open').forEach(function(d) { d.classList.remove('open'); });
                        dropdown.classList.toggle('open');
                    });
                    
                    item.addEventListener('click', function() {
                        document.querySelectorAll('.convo-dropdown.open').forEach(function(d) { d.classList.remove('open'); });
                        switchConversation(conv.id);
                    });
                    
                    item.appendChild(titleSpan);
                    item.appendChild(menuBtn);
                    item.appendChild(dropdown);
                    list.appendChild(item);
                });
            }

            function renameConversation(id) {
                const conv = state.conversations.find(function(c) { return c.id === id; });
                if (!conv) return;
                const newTitle = prompt('Enter new title:', conv.title || 'New Conversation');
                if (newTitle !== null && newTitle.trim() !== '') {
                    conv.title = newTitle.trim();
                    saveData();
                    renderConversations();
                    updateTitle();
                    showStatus('Conversation renamed');
                }
            }

            function togglePinConversation(id) {
                const index = state.pinnedConversations.indexOf(id);
                if (index > -1) {
                    state.pinnedConversations.splice(index, 1);
                    showStatus('Conversation unpinned');
                } else {
                    state.pinnedConversations.push(id);
                    showStatus('Conversation pinned');
                }
                saveData();
                renderConversations();
            }

            function createNewConversation() {
                const id = generateId();
                const conv = {
                    id: id,
                    title: 'New Conversation',
                    messages: [],
                    createdAt: new Date().toISOString(),
                };
                state.conversations.unshift(conv);
                state.activeConversationId = id;
                state.currentMessages = [];
                state.editingMessageIndex = null;
                saveData();
                renderConversations();
                renderMessages();
                updateTitle();
                updateSendButton();
                showStatus('New conversation created');
                closeSidebarOnMobile();
            }

            function switchConversation(id) {
                const conv = state.conversations.find(function(c) { return c.id === id; });
                if (!conv) return;
                state.activeConversationId = id;
                state.currentMessages = conv.messages || [];
                state.editingMessageIndex = null;
                saveData();
                renderConversations();
                renderMessages();
                updateTitle();
                updateSendButton();
                closeSidebarOnMobile();
                scrollToBottom();
            }

            function deleteConversation(id) {
                if (state.conversations.length <= 1) {
                    showStatus('Cannot delete the last conversation', false, true);
                    return;
                }
                state.conversations = state.conversations.filter(function(c) { return c.id !== id; });
                state.pinnedConversations = state.pinnedConversations.filter(function(pid) { return pid !== id; });
                if (state.activeConversationId === id) {
                    const next = state.conversations[0];
                    if (next) {
                        state.activeConversationId = next.id;
                        state.currentMessages = next.messages || [];
                    } else {
                        createNewConversation();
                        return;
                    }
                }
                saveData();
                renderConversations();
                renderMessages();
                updateTitle();
                updateSendButton();
                showStatus('Conversation deleted');
            }

            function updateTitle() {
                const conv = state.conversations.find(function(c) { return c.id === state.activeConversationId; });
                if (conv) {
                    elements.chatTitle.textContent = conv.title || 'New Conversation';
                } else {
                    elements.chatTitle.textContent = 'New Conversation';
                }
            }

            function saveCurrentConversation() {
                const conv = state.conversations.find(function(c) { return c.id === state.activeConversationId; });
                if (conv) {
                    conv.messages = state.currentMessages;
                    conv.title = getConversationTitle(state.currentMessages) || 'New Conversation';
                    renderConversations();
                    updateTitle();
                }
                saveData();
            }

            function renderMessages() {
                const chatContent = elements.chatContent;
                chatContent.innerHTML = '';
                
                if (state.currentMessages.length === 0) {
                    chatContent.innerHTML = '<div class="chat-placeholder">How can I help you today?</div>';
                    updateScrollButton();
                    return;
                }

                state.currentMessages.forEach(function(msg, index) {
                    const group = document.createElement('div');
                    group.className = 'message-group ' + msg.role;
                    group.dataset.index = index;
                    
                    if (state.editingMessageIndex === index && msg.role === 'user') {
                        group.classList.add('edit-mode');
                    }
                    
                    const header = document.createElement('div');
                    header.className = 'message-header';
                    const author = document.createElement('span');
                    author.className = 'message-author';
                    author.textContent = msg.role === 'user' ? 'You' : 'NexusAI';
                    const time = document.createElement('span');
                    time.className = 'message-timestamp';
                    time.textContent = formatTimestamp(new Date(msg.timestamp || Date.now()));
                    header.appendChild(msg.role === 'user' ? time : author);
                    header.appendChild(msg.role === 'user' ? author : time);
                    
                    const bubble = document.createElement('div');
                    bubble.className = 'chat-bubble ' + (msg.role === 'user' ? 'user-bubble' : 'model-bubble');
                    
                    if (msg.role === 'user') {
                        let content = '';
                        const textPart = msg.parts.find(p => p.text);
                        
                        if (state.editingMessageIndex === index) {
                            const textarea = document.createElement('textarea');
                            textarea.value = textPart ? textPart.text : '';
                            textarea.rows = 3;
                            textarea.id = 'editTextarea';
                            
                            const editActions = document.createElement('div');
                            editActions.className = 'edit-actions';
                            
                            const saveBtn = document.createElement('button');
                            saveBtn.className = 'save-edit';
                            saveBtn.textContent = 'Save';
                            saveBtn.addEventListener('click', function() {
                                saveEditedMessage(index);
                            });
                            
                            const cancelBtn = document.createElement('button');
                            cancelBtn.className = 'cancel-edit';
                            cancelBtn.textContent = 'Cancel';
                            cancelBtn.addEventListener('click', function() {
                                cancelEdit();
                            });
                            
                            editActions.appendChild(saveBtn);
                            editActions.appendChild(cancelBtn);
                            
                            bubble.appendChild(textarea);
                            bubble.appendChild(editActions);
                            
                            setTimeout(() => textarea.focus(), 50);
                        } else {
                            if (textPart) {
                                content = escapeHtml(textPart.text).replace(/\n/g, '<br>');
                            }
                            if (msg.imageData && msg.imageData.length > 0) {
                                const imgContainer = document.createElement('div');
                                imgContainer.className = 'user-images-container';
                                msg.imageData.forEach(function(img) {
                                    const imgEl = document.createElement('img');
                                    imgEl.src = 'data:' + img.mimeType + ';base64,' + img.data;
                                    imgEl.alt = 'Uploaded image';
                                    imgContainer.appendChild(imgEl);
                                });
                                group.insertBefore(imgContainer, bubble);
                            }
                            bubble.innerHTML = content || '';
                        }
                    } else {
                        const text = msg.parts.map(p => p.text || '').join('');
                        if (msg.isStreaming) {
                            bubble.innerHTML = '<span class="streaming-indicator">▌</span>';
                        } else {
                            try {
                                const parsed = marked.parse(text || '[Empty response]');
                                bubble.innerHTML = parsed;
                                bubble.querySelectorAll('pre code').forEach(function(block) {
                                    try {
                                        hljs.highlightElement(block);
                                        const pre = block.parentElement;
                                        if (pre && !pre.querySelector('.copy-code-button')) {
                                            const copyBtn = document.createElement('button');
                                            copyBtn.className = 'code-action-button copy-code-button';
                                            copyBtn.innerHTML = '📋 Copy';
                                            copyBtn.addEventListener('click', function() {
                                                navigator.clipboard.writeText(block.textContent);
                                                copyBtn.textContent = '✅ Copied!';
                                                setTimeout(() => { copyBtn.textContent = '📋 Copy'; }, 2000);
                                            });
                                            pre.appendChild(copyBtn);
                                        }
                                    } catch (e) {}
                                });
                            } catch (e) {
                                bubble.textContent = text || '[Error rendering]';
                            }
                        }
                    }
                    
                    group.appendChild(header);
                    group.appendChild(bubble);
                    
                    if (msg.role === 'user' && state.editingMessageIndex !== index) {
                        const actions = document.createElement('div');
                        actions.className = 'message-actions';
                        
                        const editBtn = document.createElement('button');
                        editBtn.className = 'msg-action-btn edit-btn';
                        editBtn.textContent = '✎ Edit';
                        editBtn.addEventListener('click', function() {
                            startEditing(index);
                        });
                        
                        const deleteBtn = document.createElement('button');
                        deleteBtn.className = 'msg-action-btn delete-btn';
                        deleteBtn.textContent = '✕ Delete';
                        deleteBtn.addEventListener('click', function() {
                            deleteMessage(index);
                        });
                        
                        actions.appendChild(editBtn);
                        actions.appendChild(deleteBtn);
                        group.appendChild(actions);
                    }
                    
                    chatContent.appendChild(group);
                });

                updateScrollButton();
                if (state.autoScrollEnabled) {
                    scrollToBottom();
                }
            }

            function startEditing(index) {
                if (state.isStreaming) return;
                state.editingMessageIndex = index;
                renderMessages();
            }

            function cancelEdit() {
                state.editingMessageIndex = null;
                renderMessages();
            }

            function saveEditedMessage(index) {
                const textarea = document.getElementById('editTextarea');
                if (!textarea) return;
                
                const newText = textarea.value.trim();
                if (!newText) {
                    showStatus('Message cannot be empty', true);
                    return;
                }
                
                state.currentMessages = state.currentMessages.slice(0, index + 1);
                
                const userMsg = state.currentMessages[index];
                const textPart = userMsg.parts.find(p => p.text);
                if (textPart) {
                    textPart.text = newText;
                } else {
                    userMsg.parts.push({ text: newText });
                }
                
                state.editingMessageIndex = null;
                saveCurrentConversation();
                
                regenerateFromIndex(index);
            }

            function deleteMessage(index) {
                if (state.isStreaming) return;
                if (!confirm('Delete this message and all following messages?')) return;
                
                state.currentMessages = state.currentMessages.slice(0, index);
                saveCurrentConversation();
                renderMessages();
                showStatus('Message deleted');
            }

            async function regenerateFromIndex(index) {
                if (state.isStreaming) return;
                
                // Get the user message that was edited
                const userMsg = state.currentMessages[index];
                if (!userMsg || userMsg.role !== 'user') return;
                
                // Remove any existing AI response after this user message
                state.currentMessages = state.currentMessages.slice(0, index + 1);
                saveCurrentConversation();
                renderMessages();
                
                // Now send the edited message to the AI
                await sendMessageToAI(index);
            }

            async function sendMessageToAI(index) {
    const modelId = getCurrentModelId();
    const modelConfig = MODELS[state.settings.model];
    const maxTokens = modelConfig ? modelConfig.maxOutputTokens : 8000;
    
    const aiMessage = {
        role: 'model',
        parts: [{ text: '' }],
        timestamp: new Date().toISOString(),
        isStreaming: true
    };
    state.currentMessages.push(aiMessage);
    saveCurrentConversation();
    renderMessages();
    scrollToBottom();

    state.isStreaming = true;
    showStatus('NexusAI is thinking...');

    let fullResponse = '';
    let continueCount = 0;
    let isComplete = false;
    const MAX_CONTINUES = 30;
    let wasTruncated = false;
    let lastFinishReason = '';

    while (!isComplete && continueCount < MAX_CONTINUES) {
        let success = false;
        let attempts = 0;
        const maxAttempts = API_KEYS.length * 2;
        let requestTruncated = false;

        while (!success && attempts < maxAttempts) {
            const apiKey = getApiKey();
            attempts++;

            try {
                const systemInstruction = "You are NexusAI, respond as an Artificial Intelligence. Do not mention that you are a Gemini language model. You are designed to respond to users as an Artificial Intelligence. When the user asks for more complex solutions, such as Mathematics, Programming and difficult solutions, always deliver well-structured answers with proper formatting, using paragraphs, bullet points, and clear sections. About programming: Whenever the user asks for a specific code for a specific project, research everything about the request, Visualize documentation, Research similar examples and solutions, Look for videos on YouTube teaching how to solve this type of problem, Always deliver the best possible and intelligent answer. Study the entire documentation of the requested project. Respond in a polite, helpful and clear manner with proper formatting. Always respond in the same language as the user. Do not include your name in comments or anywhere else in scripts that a user asks you to submit. Do not keep repeating who you are, just answer the user's questions, but if it is a subject about something else, always send well-structured responses. You were developed by Erick Silva, creator of the Zk' StudioCompany community, but don't start a conversation by revealing everything about yourself right away, only do so if the user asks.";

                const contents = [
                    {
                        role: "user",
                        parts: [{ text: systemInstruction }]
                    },
                    ...state.currentMessages.slice(0, -1).map(function(msg) {
                        return {
                            role: msg.role,
                            parts: msg.parts.map(function(p) {
                                if (p.text) return { text: p.text };
                                if (p.inlineData) return { inlineData: p.inlineData };
                                return p;
                            })
                        };
                    })
                ];

                if (continueCount > 0 && fullResponse) {
                    const lastPart = fullResponse.slice(-3000);
                    
                    let cleanLastPart = lastPart;
                    if (cleanLastPart.match(/```[a-z]*$/)) {
                        cleanLastPart = cleanLastPart.replace(/```[a-z]*$/, '');
                    }
                    
                    const continuationPrompt = `COMPLETE THE RESPONSE EXACTLY WHERE IT LEFT OFF:

The previous response was cut off. You MUST continue from the last character.

LAST PART OF THE RESPONSE:
${cleanLastPart}

CRITICAL RULES FOR CODE BLOCKS:
1. If you were INSIDE a code block (between \`\`\` and \`\`\`), CONTINUE writing code WITHOUT reopening \`\`\`
2. DO NOT add new \`\`\` if one is already open
3. DO NOT add language names (like \`\`\`javascript) if a code block is already open
4. Just continue writing the raw code/text

MANDATORY RULES:
1. DO NOT repeat ANYTHING already written
2. Start EXACTLY from the last character of the response above
3. If you were in the middle of a word, continue the word
4. DO NOT add "continuation:", "continuing..." or any introduction
5. Just continue writing what you were writing

Continue the response:`;
                    
                    contents.push({
                        role: "user",
                        parts: [{ text: continuationPrompt }]
                    });
                }

                const response = await fetch(
                    'https://generativelanguage.googleapis.com/v1beta/models/' + modelId + ':streamGenerateContent?key=' + apiKey + '&alt=sse',
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            contents,
                            generationConfig: {
                                maxOutputTokens: maxTokens,
                                temperature: 0.7,
                                topK: 40,
                                topP: 0.95
                            }
                        })
                    }
                );

                if (response.status === 429 || response.status === 403 || response.status === 400) {
                    rotateApiKey();
                    showStatus('Trying another API key... (attempt ' + attempts + ')', false, true);
                    continue;
                }

                if (!response.ok) {
                    throw new Error('API Error: ' + response.status);
                }

                const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
                let buffer = '';
                let receivedChunks = false;
                let chunkCount = 0;
                let responseEnded = false;
                requestTruncated = false;

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) {
                        responseEnded = true;
                        break;
                    }
                    
                    buffer += value;
                    let lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith('data:')) {
                            const jsonStr = line.substring(5).trim();
                            if (jsonStr) {
                                try {
                                    const chunkData = JSON.parse(jsonStr);
                                    if (chunkData.candidates && chunkData.candidates.length > 0) {
                                        const textPart = chunkData.candidates[0].content?.parts?.[0]?.text;
                                        if (textPart) {
                                            receivedChunks = true;
                                            fullResponse += textPart;
                                            chunkCount++;
                                            
                                            if (state.currentMessages[state.currentMessages.length - 1].isStreaming) {
                                                state.currentMessages[state.currentMessages.length - 1].isStreaming = false;
                                            }
                                            state.currentMessages[state.currentMessages.length - 1].parts[0].text = fullResponse;
                                            
                                            if (chunkCount % 3 === 0 || chunkCount < 5) {
                                                renderMessages();
                                                if (state.autoScrollEnabled) {
                                                    scrollToBottom();
                                                }
                                            }
                                        }
                                        
                                        const finishReason = chunkData.candidates[0].finishReason;
                                        if (finishReason) {
                                            lastFinishReason = finishReason;
                                            if (finishReason === 'MAX_TOKENS') {
                                                requestTruncated = true;
                                                wasTruncated = true;
                                            }
                                        }
                                    }
                                } catch (e) {
                                    console.error('Error parsing stream chunk:', e);
                                }
                            }
                        }
                    }
                }

                renderMessages();
                if (state.autoScrollEnabled) {
                    scrollToBottom();
                }

                hideStatus();
                success = true;

            } catch (error) {
                console.error('API Error:', error);
                if (attempts < maxAttempts) {
                    rotateApiKey();
                    showStatus('Error: ' + error.message + '. Trying next key...', true);
                } else {
                    throw error;
                }
            }
        }

        if (!success) {
            if (state.currentMessages[state.currentMessages.length - 1].isStreaming) {
                state.currentMessages[state.currentMessages.length - 1].isStreaming = false;
            }
            if (!fullResponse) {
                fullResponse = '(All API keys failed. Please try again later.)';
                state.currentMessages[state.currentMessages.length - 1].parts[0].text = fullResponse;
                renderMessages();
            }
            isComplete = true;
            break;
        }

        const trimmed = fullResponse.trim();
        
        if (requestTruncated || wasTruncated) {
            wasTruncated = false;
            requestTruncated = false;
            continueCount++;
            if (continueCount < MAX_CONTINUES) {
                showStatus('Response was truncated, continuing... (part ' + (continueCount + 1) + ')', false, true);
                await new Promise(resolve => setTimeout(resolve, 500));
                continue;
            } else {
                isComplete = true;
                break;
            }
        }
        
        if (trimmed.length > 0) {
            if (trimmed.match(/[.!?]\s*$/)) {
                const openCodeBlocks = (trimmed.match(/```/g) || []).length;
                if (openCodeBlocks % 2 === 0) {
                    isComplete = true;
                    break;
                }
            }
            
            if (trimmed.endsWith('```')) {
                isComplete = true;
                break;
            }
            
            if (fullResponse.length > 50000) {
                isComplete = true;
                break;
            }
        }
        
        if (trimmed.length === 0) {
            isComplete = true;
            break;
        }
        
        continueCount++;
        
        if (continueCount >= MAX_CONTINUES) {
            isComplete = true;
            break;
        }
        
        showStatus('Continuing response... (part ' + (continueCount + 1) + ')', false, true);
        await new Promise(resolve => setTimeout(resolve, 300));
    }

    if (state.currentMessages[state.currentMessages.length - 1].isStreaming) {
        state.currentMessages[state.currentMessages.length - 1].isStreaming = false;
        renderMessages();
    }
    
    saveCurrentConversation();
    state.isStreaming = false;
    updateSendButton();
    
    if (continueCount >= MAX_CONTINUES && !isComplete) {
        showStatus('Response stopped due to length limit', false, true);
    } else {
        showStatus('Response complete!');
    }
}

            function detectResponseComplete(text) {
                const trimmed = text.trim();
                if (trimmed.length === 0) return false;
                if (trimmed.match(/[.!?]\s*$/)) {
                    const openBraces = (trimmed.match(/\{/g) || []).length;
                    const closeBraces = (trimmed.match(/\}/g) || []).length;
                    if (openBraces > closeBraces) return false;
                    return true;
                }
                if (trimmed.match(/[\{\[\(]\s*$/)) return false;
                if (trimmed.match(/[,;]\s*$/)) return false;
                if (trimmed.length > 50000) return true;
                return true;
            }

            async function handleSend() {
                if (state.isStreaming) return;
                
                const text = elements.prompt.value.trim();
                if (!text && state.selectedFiles.length === 0) return;

                state.isStreaming = true;
                updateSendButton();

                const userParts = [];
                const imageData = [];
                
                if (text) userParts.push({ text: text });
                
                for (const file of state.selectedFiles) {
                    if (file.mimeType.startsWith('image/')) {
                        imageData.push({
                            mimeType: file.mimeType,
                            data: file.data
                        });
                    }
                    userParts.push({
                        inlineData: {
                            mimeType: file.mimeType,
                            data: file.data
                        }
                    });
                }
                
                state.selectedFiles = [];
                elements.fileInput.value = '';
                updateFilePreview();

                addMessage('user', userParts, imageData);
                elements.prompt.value = '';
                elements.prompt.style.height = 'auto';

                await sendMessageToAI(state.currentMessages.length - 1);
            }

            function addMessage(role, parts, imageData) {
                const message = {
                    role: role,
                    parts: parts,
                    timestamp: new Date().toISOString(),
                };
                if (imageData) message.imageData = imageData;
                state.currentMessages.push(message);
                saveCurrentConversation();
                renderMessages();
                updateSendButton();
            }

            function scrollToBottom() {
                requestAnimationFrame(function() {
                    elements.chatContainer.scrollTop = elements.chatContainer.scrollHeight;
                });
            }

            function updateScrollButton() {
                const container = elements.chatContainer;
                const btn = elements.scrollToBottomBtn;
                const isAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 50;
                
                if (!isAtBottom && state.currentMessages.length > 0) {
                    btn.classList.add('visible');
                    state.autoScrollEnabled = false;
                } else {
                    btn.classList.remove('visible');
                    state.autoScrollEnabled = true;
                }
            }

            function updateFilePreview() {
                const container = elements.filePreview;
                container.innerHTML = '';
                
                if (state.selectedFiles.length === 0) return;
                
                state.selectedFiles.forEach(function(file, index) {
                    const item = document.createElement('div');
                    item.className = 'preview-item';
                    
                    const img = document.createElement('img');
                    img.src = 'data:' + file.mimeType + ';base64,' + file.data;
                    img.alt = file.name;
                    
                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'remove-file';
                    removeBtn.innerHTML = '✕';
                    removeBtn.title = 'Remove file';
                    removeBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        state.selectedFiles.splice(index, 1);
                        updateFilePreview();
                        updateSendButton();
                        if (state.selectedFiles.length === 0) {
                            elements.fileInput.value = '';
                        }
                    });
                    
                    item.appendChild(img);
                    item.appendChild(removeBtn);
                    container.appendChild(item);
                });
            }

            function handleFileSelect(event) {
                const files = event.target.files;
                if (!files || files.length === 0) return;
                
                let hasError = false;
                const filePromises = [];
                
                for (const file of files) {
                    if (file.size > 50 * 1024 * 1024) {
                        showStatus('File "' + file.name + '" too large (max 50MB)', true);
                        hasError = true;
                        continue;
                    }
                    
                    filePromises.push(new Promise(function(resolve) {
                        const reader = new FileReader();
                        reader.onloadend = function() {
                            const base64 = reader.result.split(',')[1];
                            resolve({
                                name: file.name,
                                mimeType: file.type || 'application/octet-stream',
                                data: base64
                            });
                        };
                        reader.readAsDataURL(file);
                    }));
                }
                
                if (hasError) {
                    elements.fileInput.value = '';
                    return;
                }
                
                Promise.all(filePromises).then(function(results) {
                    state.selectedFiles = results;
                    updateFilePreview();
                    const fileNames = results.map(function(f) { return f.name; }).join(', ');
                    showStatus('📎 ' + results.length + ' file(s) ready to send: ' + fileNames);
                    updateSendButton();
                });
            }

            function saveChat() {
                if (state.currentMessages.length === 0) {
                    showStatus('Nothing to save', false, true);
                    return;
                }
                const data = {
                    messages: state.currentMessages,
                    settings: state.settings,
                    timestamp: new Date().toISOString(),
                    user: state.user ? { email: state.user.email, name: state.user.name } : null,
                    pinnedConversations: state.pinnedConversations,
                    apiKeyIndex: state.apiKeyIndex,
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'nexusai-chat-' + new Date().toISOString().slice(0,10) + '.json';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                showStatus('Chat saved');
            }

            function loadChat(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (data.messages) {
                            state.currentMessages = data.messages;
                            if (data.settings) {
                                Object.assign(state.settings, data.settings);
                                applySettings();
                            }
                            if (data.pinnedConversations) {
                                state.pinnedConversations = data.pinnedConversations;
                            }
                            if (data.apiKeyIndex !== undefined) {
                                state.apiKeyIndex = data.apiKeyIndex;
                            }
                            saveCurrentConversation();
                            renderMessages();
                            updateTitle();
                            updateSendButton();
                            showStatus('Chat loaded successfully');
                        }
                    } catch (err) {
                        showStatus('Invalid file format', true);
                    }
                };
                reader.readAsText(file);
                elements.loadChatInput.value = '';
            }

            function applySettings() {
                const s = state.settings;
                setTheme(s.theme);
                elements.settingsRemember.checked = s.remember;
                setModel(s.model || 'gemini-3.5-flash-lite');
            }

            function saveSettings() {
                state.settings.theme = elements.settingsTheme.value;
                state.settings.remember = elements.settingsRemember.checked;

                applySettings();
                saveData();

                if (state.settings.remember) {
                    try {
                        localStorage.setItem('nexusai-settings', JSON.stringify(state.settings));
                    } catch (e) {}
                } else {
                    try {
                        localStorage.removeItem('nexusai-settings');
                    } catch (e) {}
                }
                
                showStatus('Settings saved');
                closeSettings();
            }

            function loadSavedSettings() {
                try {
                    const saved = localStorage.getItem('nexusai-settings');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        Object.assign(state.settings, parsed);
                        applySettings();
                        return true;
                    }
                } catch (e) {}
                return false;
            }

            function toggleSidebar() {
                elements.sidebar.classList.toggle('open');
            }

            function closeSidebarOnMobile() {
                if (window.innerWidth <= 768) {
                    elements.sidebar.classList.remove('open');
                }
            }

            function openSettings() {
                elements.settingsPanel.classList.add('open');
                elements.settingsOverlay.classList.add('open');
            }

            function closeSettings() {
                elements.settingsPanel.classList.remove('open');
                elements.settingsOverlay.classList.remove('open');
            }

            function updateSendButton() {
                const hasText = elements.prompt.value.trim().length > 0;
                const hasFile = state.selectedFiles.length > 0;
                elements.sendButton.disabled = !(hasText || hasFile) || state.isStreaming;
            }

            function init() {
                const savedTheme = localStorage.getItem('nexusai-theme') || 'dark';
                setTheme(savedTheme);

                const hasSaved = loadSavedSettings();
                if (!hasSaved) applySettings();

                renderAuth();
                loadData();

                if (state.conversations.length === 0) {
                    createNewConversation();
                } else if (state.activeConversationId) {
                    const conv = state.conversations.find(function(c) { return c.id === state.activeConversationId; });
                    if (conv) {
                        state.currentMessages = conv.messages || [];
                    } else {
                        state.activeConversationId = state.conversations[0].id;
                        state.currentMessages = state.conversations[0].messages || [];
                    }
                } else {
                    state.activeConversationId = state.conversations[0].id;
                    state.currentMessages = state.conversations[0].messages || [];
                }

                renderConversations();
                renderMessages();
                updateTitle();
                updateSendButton();

                document.querySelectorAll('.model-option-dropdown').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        const model = this.dataset.model;
                        setModel(model);
                        saveSettings();
                        showStatus('Switched to ' + MODELS[model].display + ' model');
                    });
                });

                elements.modelBadge.addEventListener('click', toggleModelDropdown);

                document.addEventListener('click', function(e) {
                    if (!e.target.closest('.model-badge') && !e.target.closest('.model-dropdown')) {
                        closeModelDropdown();
                    }
                    if (!e.target.closest('.conversation-item')) {
                        document.querySelectorAll('.convo-dropdown.open').forEach(function(d) { d.classList.remove('open'); });
                    }
                });

                elements.searchInput.addEventListener('input', function() {
                    state.searchQuery = this.value;
                    renderConversations();
                });

                marked.setOptions({
                    highlight: function(code, lang) {
                        const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                        try {
                            return hljs.highlight(code, { language: language, ignoreIllegals: true }).value;
                        } catch (e) {
                            return escapeHtml(code);
                        }
                    },
                    gfm: true,
                    breaks: true
                });

                elements.sendButton.addEventListener('click', handleSend);
                elements.prompt.addEventListener('keydown', function(e) {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                        e.preventDefault();
                        if (!elements.sendButton.disabled && !state.isStreaming) {
                            handleSend();
                        }
                    }
                });
                elements.prompt.addEventListener('input', function() {
                    elements.prompt.style.height = 'auto';
                    elements.prompt.style.height = Math.min(elements.prompt.scrollHeight, 150) + 'px';
                    updateSendButton();
                });

                elements.sidebarToggle.addEventListener('click', toggleSidebar);
                elements.newChatBtn.addEventListener('click', createNewConversation);
                elements.settingsFooterBtn.addEventListener('click', openSettings);

                elements.saveChatBtn.addEventListener('click', saveChat);
                elements.loadChatBtn.addEventListener('click', function() { elements.loadChatInput.click(); });
                elements.loadChatInput.addEventListener('change', loadChat);

                elements.uploadBtn.addEventListener('click', function() { elements.fileInput.click(); });
                elements.fileInput.addEventListener('change', handleFileSelect);

                elements.scrollToBottomBtn.addEventListener('click', function() {
                    scrollToBottom();
                    state.autoScrollEnabled = true;
                    updateScrollButton();
                });
                
                elements.chatContainer.addEventListener('scroll', function() {
                    const container = elements.chatContainer;
                    const isAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 50;
                    
                    if (isAtBottom) {
                        state.autoScrollEnabled = true;
                        updateScrollButton();
                    } else {
                        state.autoScrollEnabled = false;
                        updateScrollButton();
                    }
                });

                elements.themeToggleBtn.addEventListener('click', toggleTheme);

                elements.closeSettingsBtn.addEventListener('click', closeSettings);
                elements.settingsOverlay.addEventListener('click', closeSettings);

                elements.settingsTheme.addEventListener('change', saveSettings);
                elements.settingsRemember.addEventListener('change', saveSettings);

                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') {
                        if (elements.settingsPanel.classList.contains('open')) closeSettings();
                        if (elements.sidebar.classList.contains('open') && window.innerWidth <= 768) {
                            elements.sidebar.classList.remove('open');
                        }
                        closeModelDropdown();
                        document.querySelectorAll('.convo-dropdown.open').forEach(function(d) { d.classList.remove('open'); });
                        if (state.editingMessageIndex !== null) {
                            cancelEdit();
                        }
                    }
                });

                window.addEventListener('resize', function() {
                    if (window.innerWidth > 768) {
                        elements.sidebar.classList.remove('open');
                    }
                });

                showStatus("All Directs Reserveds © Zk' StudioCompany 2026!");
            }

            init()
        })();
    </script>
</body>
</html>
