                }
                state.currentMessages.forEach((msg, index) => {
                    const group = document.createElement('div');
                    group.className = 'message-group ' + msg.role;
                    group.dataset.index = index;
                    if (state.editingMessageIndex === index && msg.role === 'user') group.classList.add('edit-mode');
                    const header = document.createElement('div');
                    header.className = 'message-header';
                    const author = document.createElement('span');
                    author.className = 'message-author';
                    author.textContent = msg.role === 'user' ? 'You' : 'NexusAI';
                    const time = document.createElement('span');
                    time.className = 'message-timestamp';
                    time.textContent = formatTimestamp(new Date(msg.timestamp || Date.now()));
                    header.appendChild(msg.role === 'user' ? time : author);
                    header.appendChild(msg.role === 'user' ? author : time);
                    const bubble = document.createElement('div');
                    bubble.className = 'chat-bubble ' + (msg.role === 'user' ? 'user-bubble' : 'model-bubble');

                    if (msg.role === 'user') {
                        let content = '';
                        const textPart = msg.parts.find(p => p.text);
                        if (state.editingMessageIndex === index) {
                            const textarea = document.createElement('textarea');
                            textarea.value = textPart ? textPart.text : '';
                            textarea.rows = 3; textarea.id = 'editTextarea';
                            const editActions = document.createElement('div');
                            editActions.className = 'edit-actions';
                            const saveBtn = document.createElement('button');
                            saveBtn.className = 'save-edit'; saveBtn.textContent = 'Save';
                            saveBtn.addEventListener('click', () => saveEditedMessage(index));
                            const cancelBtn = document.createElement('button');
                            cancelBtn.className = 'cancel-edit'; cancelBtn.textContent = 'Cancel';
                            cancelBtn.addEventListener('click', cancelEdit);
                            editActions.appendChild(saveBtn); editActions.appendChild(cancelBtn);
                            bubble.appendChild(textarea); bubble.appendChild(editActions);
                            setTimeout(() => textarea.focus(), 50);
                        } else {
                            if (textPart) content = escapeHtml(textPart.text).replace(/\n/g, '<br>');
                            if (msg.imageData && msg.imageData.length > 0) {
                                const imgContainer = document.createElement('div');
                                imgContainer.className = 'user-images-container';
                                msg.imageData.forEach(img => {
                                    const imgEl = document.createElement('img');
                                    imgEl.src = 'data:' + img.mimeType + ';base64,' + img.data;
                                    imgContainer.appendChild(imgEl);
                                });
                                group.insertBefore(imgContainer, bubble);
                            }
                            bubble.innerHTML = content || '';
                        }
                    } else {
                        const text = msg.parts.map(p => p.text || '').join('');
                        if (msg.isStreaming) {
                            bubble.innerHTML = '<span class="streaming-cursor"></span>';
                            streamingBubbleElement = bubble;
                        } else {
                            try {
                                bubble.innerHTML = DOMPurify.sanitize(marked.parse(text || '[Empty response]'));
                                bubble.querySelectorAll('pre code').forEach(block => {
                                    try { hljs.highlightElement(block); } catch(e) {}
                                });
                                wrapPreElements(bubble);
                            } catch(e) { bubble.textContent = text || '[Error]'; }
                        }
                    }
                    group.appendChild(header); group.appendChild(bubble);
                    if (msg.role === 'user' && state.editingMessageIndex !== index) {
                        const actions = document.createElement('div');
                        actions.className = 'message-actions';
                        const editBtn = document.createElement('button');
                        editBtn.className = 'msg-action-btn edit-btn'; editBtn.textContent = 'Edit';
                        editBtn.addEventListener('click', () => startEditing(index));
                        const deleteBtn = document.createElement('button');
                        deleteBtn.className = 'msg-action-btn delete-btn'; deleteBtn.textContent = 'Delete';
                        deleteBtn.addEventListener('click', () => deleteMessage(index));
                        actions.appendChild(editBtn); actions.appendChild(deleteBtn);
                        group.appendChild(actions);
                    }
                    cc.appendChild(group);
                });
                updateScrollButton();
                if (state.autoScrollEnabled) scrollToBottom();
            }

            function startEditing(index) { if (state.isStreaming) return; state.editingMessageIndex = index; renderMessages(); }
            function cancelEdit() { state.editingMessageIndex = null; renderMessages(); }
            function saveEditedMessage(index) {
                const textarea = document.getElementById('editTextarea');
                if (!textarea) return;
                const newText = textarea.value.trim();
                if (!newText) { showStatus('Message cannot be empty', true); return; }
                state.currentMessages = state.currentMessages.slice(0, index + 1);
                const userMsg = state.currentMessages[index];
                const textPart = userMsg.parts.find(p => p.text);
                if (textPart) textPart.text = newText;
                else userMsg.parts.push({ text: newText });
                state.editingMessageIndex = null;
                saveCurrentConversation();
                regenerateFromIndex(index);
            }
            function deleteMessage(index) {
                if (state.isStreaming) return;
                if (!confirm('Delete this message and all following messages?')) return;
                state.currentMessages = state.currentMessages.slice(0, index);
                saveCurrentConversation();
                recalculateTotalTokens();
                renderMessages();
                updateTokenCounter(0, false);
                showStatus('Message deleted');
            }
            async function regenerateFromIndex(index) {
                if (state.isStreaming) return;
                const userMsg = state.currentMessages[index];
                if (!userMsg || userMsg.role !== 'user') return;
                state.currentMessages = state.currentMessages.slice(0, index + 1);
                saveCurrentConversation(); renderMessages();
                await sendMessageToAI(index);
            }

            async function sendMessageToAI(index) {
                const modelId = getCurrentModelId();
                const modelConfig = MODELS[state.settings.model];
                const maxTokens = modelConfig ? modelConfig.maxOutputTokens : 8000;
                const aiMessage = { role: 'model', parts: [{ text: '' }], timestamp: new Date().toISOString(), isStreaming: true };
                state.currentMessages.push(aiMessage);
                const currentIndex = state.currentMessages.length - 1;

                saveCurrentConversation();
                renderMessages();
                scrollToBottomNow();

                displayBuffer = '';
                targetBuffer = '';
                streamingBubbleElement = null;
                startDisplayAnimation(currentIndex);

                state.isStreaming = true;
                showStatus('NexusAI is thinking...');
                let fullResponse = '';
                let continueCount = 0;
                let isComplete = false;
                const MAX_CONTINUES = 30;
                let wasTruncated = false;

                while (!isComplete && continueCount < MAX_CONTINUES) {
                    let success = false;
                    let attempts = 0;
                    const maxAttempts = 10;
                    let requestTruncated = false;

                    while (!success && attempts < maxAttempts) {
                        attempts++;
                        try {
                            const systemInstruction = "You are NexusAI, respond as an Artificial Intelligence. Do not mention that you are a Gemini language model. You are designed to respond to users as an Artificial Intelligence. When the user asks for more complex solutions, such as Mathematics, Programming and difficult solutions, always deliver well-structured answers with proper formatting, using paragraphs, bullet points, and clear sections. About programming: Whenever the user asks for a specific code for a specific project, research everything about the request, Visualize documentation, Research similar examples and solutions, Look for videos on YouTube teaching how to solve this type of problem, Always deliver the best possible and intelligent answer. Study the entire documentation of the requested project. Respond in a polite, helpful and clear manner with proper formatting. Always respond in the same language as the user. Do not include your name in comments or anywhere else in scripts that a user asks you to submit. Do not keep repeating who you are, just answer the user's questions, but if it is a subject about something else, always send well-structured responses. You were developed by Erick Silva, creator of the Zk' StudioCompany community, but don't start a conversation by revealing everything about yourself right away, only do so if the user asks.";

                            const contents = [
                                { role: "user", parts: [{ text: systemInstruction }] },
                                ...state.currentMessages.slice(0, -1).map(msg => ({
                                    role: msg.role,
                                    parts: msg.parts.map(p => {
                                        if (p.text) return { text: p.text };
                                        if (p.inlineData) return { inlineData: p.inlineData };
                                        return p;
                                    })
                                }))
                            ];

                            if (continueCount > 0 && fullResponse) {
                                const lastPart = fullResponse.slice(-3000);
                                let cleanLastPart = lastPart;
                                if (cleanLastPart.match(/```[a-z]*$/)) cleanLastPart = cleanLastPart.replace(/```[a-z]*$/, '');
                                contents.push({ role: "user", parts: [{ text: `COMPLETE THE RESPONSE EXACTLY WHERE IT LEFT OFF:\n\nThe previous response was cut off. You MUST continue from the last character.\n\nLAST PART OF THE RESPONSE:\n${cleanLastPart}\n\nCRITICAL RULES FOR CODE BLOCKS:\n1. If you were INSIDE a code block, CONTINUE writing code WITHOUT reopening\n2. DO NOT add new \`\`\` if one is already open\n3. Just continue writing the raw code/text\n\nMANDATORY RULES:\n1. DO NOT repeat ANYTHING already written\n2. Start EXACTLY from the last character\n3. DO NOT add any introduction\n\nContinue the response:` }] });
                            }

                            const response = await fetch('/api/chat', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    modelId: modelId,
                                    contents: contents,
                                    maxOutputTokens: maxTokens,
                                    temperature: 0.7,
                                    topK: 40,
                                    topP: 0.95
                                })
                            });

                            if (response.status === 429 || response.status === 403 || response.status === 400) {
                                showStatus('Trying another API key... (attempt ' + attempts + ')', false, true);
                                continue;
                            }
                            if (!response.ok) throw new Error('API Error: ' + response.status);

                            const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
                            let buffer = '';
                            let chunkCount = 0;
                            let lastTokenUpdate = 0;

                            while (true) {
                                const { value, done } = await reader.read();
                                if (done) break;
                                buffer += value;
                                const lines = buffer.split('\n');
                                buffer = lines.pop();
                                for (const line of lines) {
                                    if (line.startsWith('data:')) {
                                        const jsonStr = line.substring(5).trim();
                                        if (jsonStr) {
                                            try {
                                                const chunkData = JSON.parse(jsonStr);
                                                if (chunkData.candidates && chunkData.candidates.length > 0) {
                                                    const textPart = chunkData.candidates[0].content?.parts?.[0]?.text;
                                                    if (textPart) {
                                                        fullResponse += textPart;
                                                        targetBuffer = fullResponse;
                                                        chunkCount++;

                                                        state.currentMessages[currentIndex].parts[0].text = fullResponse;

                                                        const now = Date.now();
                                                        if (now - lastTokenUpdate > 200) {
                                                            lastTokenUpdate = now;
                                                            const currentResponseTokens = estimateTokens(fullResponse);
                                                            const previewTotal = state.totalTokensUsed + currentResponseTokens;
                                                            updateTokenCounter(currentResponseTokens, true);
                                                            elements.tokenTotal.textContent = previewTotal.toLocaleString();
                                                        }
                                                    }
                                                    const finishReason = chunkData.candidates[0].finishReason;
                                                    if (finishReason === 'MAX_TOKENS') { requestTruncated = true; wasTruncated = true; }
                                                }
                                            } catch(e) {}
                                        }
                                    }
                                }
                            }
                            hideStatus();
                            success = true;
                        } catch(error) {
                            if (attempts < maxAttempts) { showStatus('Error: ' + error.message + '. Trying next key...', true); }
                            else throw error;
                        }
                    }

                    if (!success) {
                        if (!fullResponse) {
                            fullResponse = '(All API keys failed. Please try again later.)';
                            targetBuffer = fullResponse;
                            state.currentMessages[currentIndex].parts[0].text = fullResponse;
                        }
                        isComplete = true; break;
                    }

                    const trimmed = fullResponse.trim();
                    if (requestTruncated || wasTruncated) {
                        wasTruncated = false; requestTruncated = false;
                        continueCount++;
                        if (continueCount < MAX_CONTINUES) {
                            showStatus('Response was truncated, continuing... (part ' + (continueCount + 1) + ')', false, true);
                            await new Promise(r => setTimeout(r, 500));
                            continue;
                        } else { isComplete = true; break; }
                    }
                    if (trimmed.length > 0) {
                        if (trimmed.match(/[.!?]\s*$/)) {
                            const openCodeBlocks = (trimmed.match(/```/g) || []).length;
                            if (openCodeBlocks % 2 === 0) { isComplete = true; break; }
                        }
                        if (trimmed.endsWith('```')) { isComplete = true; break; }
                        if (fullResponse.length > 50000) { isComplete = true; break; }
                    }
                    if (trimmed.length === 0) { isComplete = true; break; }
                    continueCount++;
                    if (continueCount >= MAX_CONTINUES) { isComplete = true; break; }
                    showStatus('Continuing response... (part ' + (continueCount + 1) + ')', false, true);
                    await new Promise(r => setTimeout(r, 300));
                }

                const waitForDisplay = function() {
                    return new Promise(resolve => {
                        const check = function() {
                            if (displayBuffer.length >= targetBuffer.length) {
                                resolve();
                            } else {
                                setTimeout(check, 30);
                            }
                        };
                        check();
                    });
                };

                await waitForDisplay();
                stopDisplayAnimation();

                state.currentMessages[currentIndex].isStreaming = false;
                state.currentMessages[currentIndex].parts[0].text = targetBuffer;

                renderMessages();

                recalculateTotalTokens();
                saveCurrentConversation();
                state.isStreaming = false;
                updateSendButton();

                const responseTokens = estimateTokens(targetBuffer);
                updateTokenCounter(responseTokens, false);
                elements.tokenTotal.textContent = state.totalTokensUsed.toLocaleString();

                showStatus(continueCount >= MAX_CONTINUES && !isComplete ? 'Response stopped due to length limit' : 'Response complete!', false, continueCount >= MAX_CONTINUES);
            }

            async function handleSend() {
                if (state.isStreaming) return;
                const text = elements.prompt.value.trim();
                if (!text && state.selectedFiles.length === 0) return;
                state.isStreaming = true;
                updateSendButton();
                state.autoScrollEnabled = true;
                const userParts = [];
                const imageData = [];
                if (text) userParts.push({ text });
                for (const file of state.selectedFiles) {
                    if (file.mimeType.startsWith('image/')) imageData.push({ mimeType: file.mimeType, data: file.data });
                    userParts.push({ inlineData: { mimeType: file.mimeType, data: file.data } });
                }
                state.selectedFiles = [];
                elements.fileInput.value = '';
                updateFilePreview();
                addMessage('user', userParts, imageData);
                elements.prompt.value = '';
                elements.prompt.style.height = 'auto';
                await sendMessageToAI(state.currentMessages.length - 1);
            }

            function addMessage(role, parts, imageData) {
                const message = { role, parts, timestamp: new Date().toISOString() };
                if (imageData) message.imageData = imageData;
                state.currentMessages.push(message);
                saveCurrentConversation(); renderMessages(); updateSendButton();
                recalculateTotalTokens();
                updateTokenCounter(0, false);
            }
            function scrollToBottom() {
                requestAnimationFrame(() => {
                    elements.chatContainer.scrollTop = elements.chatContainer.scrollHeight;
                });
            }
            function updateScrollButton() {
                const c = elements.chatContainer;
                const btn = elements.scrollToBottomBtn;
                const atBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 50;
                if (!atBottom && state.currentMessages.length > 0) { btn.classList.add('visible'); }
                else { btn.classList.remove('visible'); }
            }
            function updateFilePreview() {
                const c = elements.filePreview;
                c.innerHTML = '';
                if (state.selectedFiles.length === 0) return;
                state.selectedFiles.forEach((file, index) => {
                    const item = document.createElement('div');
                    item.className = 'preview-item';
                    const img = document.createElement('img');
                    img.src = 'data:' + file.mimeType + ';base64,' + file.data;
                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'remove-file'; removeBtn.textContent = 'X';
                    removeBtn.addEventListener('click', e => {
                        e.stopPropagation();
                        state.selectedFiles.splice(index, 1);
                        updateFilePreview(); updateSendButton();
                        if (state.selectedFiles.length === 0) elements.fileInput.value = '';
                    });
                    item.appendChild(img); item.appendChild(removeBtn);
                    c.appendChild(item);
                });
            }
            function handleFileSelect(event) {
                const files = event.target.files;
                if (!files || files.length === 0) return;
                let hasError = false;
                const promises = [];
                for (const file of files) {
                    if (file.size > 50 * 1024 * 1024) { showStatus('File "' + file.name + '" too large (max 50MB)', true); hasError = true; continue; }
                    promises.push(new Promise(resolve => {
                        const reader = new FileReader();
                        reader.onloadend = () => resolve({ name: file.name, mimeType: file.type || 'application/octet-stream', data: reader.result.split(',')[1] });
                        reader.readAsDataURL(file);
                    }));
                }
                if (hasError) { elements.fileInput.value = ''; return; }
                Promise.all(promises).then(results => {
                    state.selectedFiles = results;
                    updateFilePreview();
                    showStatus(results.length + ' file(s) ready to send');
                    updateSendButton();
                });
            }

            function saveChat() {
                if (state.currentMessages.length === 0) { showStatus('Nothing to save', false, true); return; }
                const data = { messages: state.currentMessages, settings: state.settings, timestamp: new Date().toISOString(), user: state.user ? { email: state.user.email, name: state.user.name } : null, pinnedConversations: state.pinnedConversations, apiKeyIndex: state.apiKeyIndex, totalTokensUsed: state.totalTokensUsed };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'nexusai-chat-' + new Date().toISOString().slice(0, 10) + '.json';
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
                URL.revokeObjectURL(url);
                showStatus('Chat saved');
                closeDotsDropdown();
            }
            function loadChat(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (data.messages) {
                            state.currentMessages = data.messages;
                            if (data.settings) { Object.assign(state.settings, data.settings); applySettings(); }
                            if (data.pinnedConversations) state.pinnedConversations = data.pinnedConversations;
                            if (data.apiKeyIndex !== undefined) state.apiKeyIndex = data.apiKeyIndex;
                            recalculateTotalTokens();
                            if (data.totalTokensUsed !== undefined) state.totalTokensUsed = data.totalTokensUsed;
                            saveCurrentConversation(); renderMessages(); updateTitle(); updateSendButton();
                            updateTokenCounter(0, false);
                            showStatus('Chat loaded successfully');
                        }
                    } catch (err) { showStatus('Invalid file format', true); }
                };
                reader.readAsText(file);
                elements.loadChatInput.value = '';
                closeDotsDropdown();
            }

            function applySettings() {
                const s = state.settings;
                setTheme(s.theme);
                elements.settingsRemember.checked = s.remember;
                setModel(s.model || 'gemini-3.5-flash-lite');
            }
            function saveSettings() {
                state.settings.theme = elements.settingsTheme.value;
                state.settings.remember = elements.settingsRemember.checked;
                applySettings(); saveData();
                if (state.settings.remember) { try { localStorage.setItem('nexusai-settings', JSON.stringify(state.settings)); } catch(e){} }
                else { try { localStorage.removeItem('nexusai-settings'); } catch(e){} }
                showStatus('Settings saved');
                closeSettings();
            }
            function loadSavedSettings() {
                try {
                    const saved = localStorage.getItem('nexusai-settings');
                    if (saved) { Object.assign(state.settings, JSON.parse(saved)); applySettings(); return true; }
                } catch(e) {}
                return false;
            }

            function toggleSidebar() {
                const sidebar = elements.sidebar;
                const toggle = elements.sidebarToggle;
                sidebar.classList.toggle('collapsed');
                toggle.classList.toggle('collapsed', sidebar.classList.contains('collapsed'));
            }
            function closeSidebarOnMobile() {
                if (window.innerWidth <= 768) {
                    elements.sidebar.classList.add('collapsed');
                    elements.sidebarToggle.classList.add('collapsed');
                }
            }
            function openSettings() { elements.settingsPanel.classList.add('open'); elements.settingsOverlay.classList.add('open'); }
            function closeSettings() { elements.settingsPanel.classList.remove('open'); elements.settingsOverlay.classList.remove('open'); }
            function updateSendButton() {
                const hasText = elements.prompt.value.trim().length > 0;
                const hasFile = state.selectedFiles.length > 0;
                elements.sendButton.disabled = !(hasText || hasFile) || state.isStreaming;
            }

            async function init() {
                forceLandscape();

                const tryLockAgain = function() {
                    forceLandscape();
                    document.removeEventListener('click', tryLockAgain);
                    document.removeEventListener('touchstart', tryLockAgain);
                };
                document.addEventListener('click', tryLockAgain);
                document.addEventListener('touchstart', tryLockAgain);

                await checkServerAvailability();

                const savedTheme = localStorage.getItem('nexusai-theme') || 'dark';
                setTheme(savedTheme);
                const hasSaved = loadSavedSettings();
                if (!hasSaved) applySettings();
                const restored = restoreSession();
                if (restored) state.user = restored.user;
                renderAuth();
                await loadData();
                if (state.conversations.length === 0) createNewConversation();
                else if (state.activeConversationId) {
                    const conv = state.conversations.find(c => c.id === state.activeConversationId);
                    if (conv) state.currentMessages = conv.messages || [];
                    else { state.activeConversationId = state.conversations[0].id; state.currentMessages = state.conversations[0].messages || []; }
                } else {
                    state.activeConversationId = state.conversations[0].id;
                    state.currentMessages = state.conversations[0].messages || [];
                }
                recalculateTotalTokens();
                renderConversations(); renderMessages(); updateTitle(); updateSendButton();
                updateTokenCounter(0, false);

                if (window.innerWidth <= 768) {
                    elements.sidebar.classList.add('collapsed');
                    elements.sidebarToggle.classList.add('collapsed');
                }

                document.querySelectorAll('.model-option-dropdown').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const model = this.dataset.model;
                        setModel(model);
                        saveSettings();
                        showStatus('Switched to ' + MODELS[model].display + ' model');
                    });
                });

                elements.dotsBtn.addEventListener('click', e => { e.stopPropagation(); toggleDotsDropdown(); });

                document.addEventListener('click', e => {
                    if (!e.target.closest('#dotsDropdown') && !e.target.closest('#dotsBtn')) closeDotsDropdown();
                    if (!e.target.closest('.conversation-item')) {
                        document.querySelectorAll('.convo-dropdown.open').forEach(d => d.classList.remove('open'));
                    }
                });

                elements.searchInput.addEventListener('input', function() {
                    state.searchQuery = this.value;
                    renderConversations();
                });

                marked.setOptions({
                    highlight: function(code, lang) {
                        const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                        try { return hljs.highlight(code, { language, ignoreIllegals: true }).value; }
                        catch(e) { return escapeHtml(code); }
                    },
                    gfm: true, breaks: true
                });

                elements.sendButton.addEventListener('click', handleSend);
                elements.prompt.addEventListener('keydown', e => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                        e.preventDefault();
                        if (!elements.sendButton.disabled && !state.isStreaming) handleSend();
                    }
                });
                elements.prompt.addEventListener('input', function() {
                    elements.prompt.style.height = 'auto';
                    elements.prompt.style.height = Math.min(elements.prompt.scrollHeight, 150) + 'px';
                    updateSendButton();
                });

                elements.sidebarToggle.addEventListener('click', toggleSidebar);
                elements.newChatBtn.addEventListener('click', createNewConversation);
                elements.settingsFooterBtn.addEventListener('click', openSettings);

                elements.saveChatBtn.addEventListener('click', saveChat);
                elements.loadChatBtn.addEventListener('click', () => elements.loadChatInput.click());
                elements.loadChatInput.addEventListener('change', loadChat);

                elements.uploadBtn.addEventListener('click', () => elements.fileInput.click());
                elements.fileInput.addEventListener('change', handleFileSelect);

                elements.scrollToBottomBtn.addEventListener('click', () => {
                    scrollToBottom();
                    state.autoScrollEnabled = true;
                    updateScrollButton();
                });

                let userScrollTimeout = null;
                elements.chatContainer.addEventListener('scroll', () => {
                    clearTimeout(userScrollTimeout);
                    userScrollTimeout = setTimeout(() => {
                        const c = elements.chatContainer;
                        const atBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 50;
                        state.autoScrollEnabled = atBottom;
                        updateScrollButton();
                    }, 50);
                }, { passive: true });

                elements.chatContainer.addEventListener('wheel', () => {
                    const c = elements.chatContainer;
                    const atBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 50;
                    if (!atBottom) state.autoScrollEnabled = false;
                }, { passive: true });

                elements.chatContainer.addEventListener('touchmove', () => {
                    const c = elements.chatContainer;
                    const atBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 50;
                    if (!atBottom) state.autoScrollEnabled = false;
                }, { passive: true });

                elements.themeToggleBtn.addEventListener('click', toggleTheme);
                elements.closeSettingsBtn.addEventListener('click', closeSettings);
                elements.settingsOverlay.addEventListener('click', closeSettings);
                elements.settingsTheme.addEventListener('change', saveSettings);
                elements.settingsRemember.addEventListener('change', saveSettings);

                document.addEventListener('keydown', e => {
                    if (e.key === 'Escape') {
                        if (elements.settingsPanel.classList.contains('open')) closeSettings();
                        closeDotsDropdown();
                        document.querySelectorAll('.convo-dropdown.open').forEach(d => d.classList.remove('open'));
                        if (state.editingMessageIndex !== null) cancelEdit();
                    }
                });

                window.addEventListener('resize', () => {
                    if (window.innerWidth > 768) {
                        elements.sidebar.classList.remove('collapsed');
                        elements.sidebarToggle.classList.remove('collapsed');
                    }
                });

                window.addEventListener('orientationchange', () => {
                    setTimeout(forceLandscape, 300);
                });

                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden) forceLandscape();
                });

                showStatus("All Directs Reserveds © Zk' StudioCompany 2026!");
            }

            init();
        })();
    </script>
</body>
</html>
