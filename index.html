<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
    <title>NexusAI - Chat</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="highlight-theme">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>

    <style>
        :root {
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            --transition-speed: 0.625s ease;
            --sidebar-width: 260px;
            --bg-color: #0a0a0a;
            --text-color: #d4d4d4;
            --primary-color: #4060ff;
            --secondary-color: #737373;
            --card-bg: #141414;
            --input-bg: #1a1a1a;
            --input-border: #2c2c2c;
            --error-color: #f44336;
            --warning-color: #ffca28;
            --code-bg: #0a0a0a;
            --border-color: #1a1a1a;
            --user-bubble-text: #ffffff;
            --model-bubble-bg: transparent;
            --scrollbar-track: transparent;
            --scrollbar-thumb: #333;
            --bubble-radius: 16px;
            --timestamp-color: #666;
            --sidebar-bg: #0a0a0a;
            --shadow-color: rgba(0,0,0,0.6);
            --hover-bg: #1a1a1a;
            --active-bg: transparent;
            --text-primary: #e5e5e5;
            --text-muted: #a3a3a3;
            --text-dim: #737373;
            --divider: #1a1a1a;
            --new-chat-bg: transparent;
            --new-chat-border: #2e2e2e;
            --new-chat-text: #e5e5e5;
            --search-bg: #0a0a0a;
            --search-border: #2e2e2e;
            --dropdown-bg: #1a1a1a;
            --dropdown-border: #2e2e2e;
            --code-inline-bg: rgba(46,46,46,0.8);
            --code-block-bg: #0a0a0a;
            --code-block-border: #2e2e2e;
            --icon-btn-bg: rgba(69,69,69,0.5);
            --icon-btn-hover: #454545;
            --send-btn-bg: #454545;
            --send-btn-hover: #000;
            --model-label-color: #e5e5e5;
            --bubble-user-bg: #1a1a1a;
            --bubble-user-text: #e5e5e5;
            --heading-color: #e5e5e5;
            --scroll-btn-bg: #2e2e2e;
            --scroll-btn-hover: #454545;
            --user-avatar-bg: #737373;
            --edit-save-bg: #d4d4d4;
            --edit-save-text: #0a0a0a;
            --edit-cancel-bg: #2e2e2e;
            --edit-cancel-text: #d4d4d4;
            --logout-hover: #f44336;
            --logo-color: #ffffff;
            --date-header-color: #737373;
            --convo-pin-color: #fdba74;
        }

        html[data-theme='light'] {
            --bg-color: #ffffff;
            --text-color: #111111;
            --primary-color: #4060ff;
            --secondary-color: #495057;
            --card-bg: #ffffff;
            --input-bg: #f5f5f5;
            --input-border: #e0e0e0;
            --error-color: #dc3545;
            --warning-color: #ffc107;
            --code-bg: #f5f5f5;
            --border-color: #e0e0e0;
            --user-bubble-text: #ffffff;
            --model-bubble-bg: transparent;
            --scrollbar-thumb: #ccc;
            --timestamp-color: #6c757d;
            --sidebar-bg: #fafafa;
            --shadow-color: rgba(0,0,0,0.08);
            --hover-bg: #f0f0f0;
            --active-bg: transparent;
            --text-primary: #111111;
            --text-muted: #495057;
            --text-dim: #6c757d;
            --divider: #e5e5e5;
            --new-chat-bg: transparent;
            --new-chat-border: #d0d0d0;
            --new-chat-text: #111111;
            --search-bg: #ffffff;
            --search-border: #d0d0d0;
            --dropdown-bg: #ffffff;
            --dropdown-border: #e0e0e0;
            --code-inline-bg: #f0f0f0;
            --code-block-bg: #f5f5f5;
            --code-block-border: #e0e0e0;
            --icon-btn-bg: #e9ecef;
            --icon-btn-hover: #dee2e6;
            --send-btn-bg: #d0d0d0;
            --send-btn-hover: #000;
            --model-label-color: #111111;
            --bubble-user-bg: #e9ecef;
            --bubble-user-text: #111111;
            --heading-color: #111111;
            --scroll-btn-bg: #e9ecef;
            --scroll-btn-hover: #dee2e6;
            --user-avatar-bg: #6c757d;
            --edit-save-bg: #111111;
            --edit-save-text: #ffffff;
            --edit-cancel-bg: #e9ecef;
            --edit-cancel-text: #111111;
            --logout-hover: #dc3545;
            --logo-color: #111111;
            --date-header-color: #6c757d;
            --convo-pin-color: #c2410c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none !important; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%; margin: 0; padding: 0;
            overflow: hidden;
            position: fixed;
            inset: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            transition: background-color var(--transition-speed), color var(--transition-speed);
            display: flex;
            height: 100dvh;
            width: 100%;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

        .sidebar {
            width: var(--sidebar-width);
            height: 100dvh;
            background-color: var(--bg-color);
            border-right: none;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: width 0.3s, opacity 0.3s;
            z-index: 50;
            overflow: hidden;
            opacity: 1;
        }
        .sidebar.collapsed {
            width: 0;
            opacity: 0;
        }
        .sidebar > * { width: var(--sidebar-width); }

        .sidebar-header {
            padding: 14px 8px 14px 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 56px;
            flex-shrink: 0;
        }
        .sidebar-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .sidebar-header h2 svg { width: 22px; height: 22px; color: var(--text-color); }

        .new-chat-btn {
            background: var(--new-chat-bg);
            color: var(--new-chat-text);
            border: 1px solid var(--new-chat-border);
            border-radius: 8px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            gap: 3px;
            white-space: nowrap;
            font-family: inherit;
        }
        .new-chat-btn:hover { background: var(--hover-bg); }
        .new-chat-btn svg { width: 14px; height: 14px; }

        .search-container {
            padding: 6px 12px;
        }
        .search-input {
            width: 100%; padding: 6px 10px;
            border: 1px solid var(--search-border);
            border-radius: 6px;
            background-color: var(--search-bg);
            color: var(--text-color);
            font-size: 13px;
            font-family: inherit;
        }
        .search-input:focus { border-color: var(--primary-color); }
        .search-input::placeholder { color: var(--secondary-color); }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
        }

        .conversation-date-header {
            font-size: 11px;
            font-weight: 600;
            color: var(--date-header-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 12px 8px 4px;
        }
        .conversation-date-header:first-child {
            padding-top: 0;
        }

        .conversation-item {
            padding: 6px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-color);
            font-size: 14px;
            position: relative;
            user-select: none;
            height: 32px;
        }
        .conversation-item:hover { background: var(--hover-bg); }
        .conversation-item.active { background: var(--active-bg); }
        .conversation-item .convo-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            background: none;
            border: none;
            color: inherit;
            font: inherit;
            text-align: left;
            padding: 0;
            cursor: pointer;
        }
        .conversation-item .convo-pin {
            flex: 0 0 auto;
            font-size: 11px;
            color: var(--convo-pin-color);
            margin-right: 2px;
        }
        .conversation-item .convo-menu-trigger {
            opacity: 0;
            transition: opacity 0.15s;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1;
        }
        .conversation-item:hover .convo-menu-trigger { opacity: 1; }
        .conversation-item .convo-menu-trigger:hover { background: var(--hover-bg); color: var(--text-primary); }
        .conversation-item .convo-dropdown {
            display: none;
            position: absolute;
            right: 4px;
            top: 100%;
            background-color: var(--dropdown-bg);
            border: 1px solid var(--dropdown-border);
            border-radius: 8px;
            box-shadow: 0 4px 20px var(--shadow-color);
            z-index: 100;
            min-width: 130px;
            overflow: hidden;
        }
        .conversation-item .convo-dropdown.open { display: block; }
        .conversation-item .convo-dropdown button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: transparent;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 13px;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }
        .conversation-item .convo-dropdown button:hover { background: var(--hover-bg); }
        .conversation-item .convo-dropdown button.danger { color: var(--error-color); }
        .conversation-item .convo-dropdown button svg { width: 14px; height: 14px; flex-shrink: 0; }

        .sidebar-footer {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 1px;
            flex-shrink: 0;
            border-top: 1px solid var(--divider);
        }
        .sidebar-footer .footer-btn {
            background: transparent;
            border: none;
            border-radius: 8px;
            padding: 6px 8px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }
        .sidebar-footer .footer-btn:hover { background: var(--hover-bg); color: var(--text-primary); }
        .sidebar-footer .footer-btn svg { width: 16px; height: 16px; flex: 0 0 auto; }
        .sidebar-footer .footer-btn span { flex: 1; }

        .user-info-sidebar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 8px;
            cursor: default;
            user-select: none;
            transition: background 0.15s;
        }
        .user-info-sidebar:hover { background: var(--hover-bg); }
        .user-info-sidebar .user-avatar-small {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--user-avatar-bg);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 10px;
            object-fit: cover;
            flex: 0 0 auto;
        }
        .user-info-sidebar .user-name-text {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .sidebar-toggle-main {
            position: fixed;
            left: var(--sidebar-width);
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 64px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            transition: left 0.3s;
            padding: 0;
        }
        .sidebar-toggle-main.collapsed { left: 0; }
        .sidebar-toggle-main span {
            display: block;
            width: 4px;
            height: 12px;
            border-radius: 2px;
            background: var(--text-muted);
            opacity: 0.7;
            transition: transform 0.2s, background 0.2s, opacity 0.2s;
        }
        .sidebar-toggle-main:hover span { background: var(--text-primary); opacity: 1; }
        .sidebar-toggle-main.collapsed span:nth-child(1) { transform: rotate(-20deg); }
        .sidebar-toggle-main.collapsed span:nth-child(2) { transform: rotate(20deg); }

        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            min-height: 0;
            min-width: 0;
            position: relative;
            overflow: hidden;
            background-color: var(--bg-color);
        }

        .chat-container {
            flex: 1 1 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 0;
            overscroll-behavior: contain;
        }
        .chat-content {
            width: 100%;
            max-width: 768px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }
        @media (min-width: 1280px) {
            .chat-content { max-width: 896px; padding-top: 40px; }
        }

        .chat-welcome {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex: 1;
            min-height: 50vh;
            font-size: 36px;
            font-weight: 600;
            color: var(--logo-color);
            user-select: none;
            padding: 20px;
        }
        .chat-welcome svg {
            width: 44px;
            height: 44px;
            color: var(--logo-color);
            flex: 0 0 auto;
        }
        @media (min-width: 768px) {
            .chat-welcome { font-size: 48px; gap: 16px; }
            .chat-welcome svg { width: 58px; height: 58px; }
        }

        .message-group {
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .message-group.user { align-items: flex-end; }
        .message-group.model { align-items: flex-start; }

        .message-header {
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin-bottom: 3px;
            padding: 0 20px;
            font-size: 11.4px;
            color: var(--text-dim);
        }
        .message-group.user .message-header { flex-direction: row-reverse; }
        .message-author { font-weight: 600; color: var(--text-muted); }
        .message-timestamp { color: var(--text-dim); font-size: 10.4px; }

        .message-actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            padding: 0 20px;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .message-group:hover .message-actions { opacity: 1; }
        .message-actions .msg-action-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 4px;
            transition: background 0.15s, color 0.15s;
            font-family: inherit;
        }
        .message-actions .msg-action-btn:hover { background: var(--hover-bg); color: var(--text-primary); }
        .message-actions .msg-action-btn.delete-btn:hover { color: var(--error-color); }

        .chat-bubble {
            padding: 14px 20px;
            border-radius: var(--bubble-radius);
            max-width: 85%;
            word-wrap: break-word;
            line-height: 1.625;
            font-size: 15px;
            position: relative;
        }

        .user-bubble {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 8px 20px;
            font-size: 16px;
            line-height: 1.5;
            border-radius: 0;
            max-width: 85%;
        }

        .model-bubble {
            background: linear-gradient(to bottom right, rgba(255,255,255,0.03), transparent);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            padding: 14px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 60px;
            max-width: 100%;
        }
        html[data-theme='light'] .model-bubble {
            background: linear-gradient(to bottom right, rgba(0,0,0,0.03), transparent);
            border: 1px solid var(--border-color);
        }

        .edit-mode .user-bubble {
            border: 1px solid var(--text-dim);
            border-radius: 12px;
            background: var(--card-bg);
            padding: 10px 14px;
            max-width: 100%;
        }
        .edit-mode .user-bubble textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-family: var(--font-family);
            font-size: 15px;
            resize: vertical;
            min-height: 40px;
            outline: none;
        }
        .edit-mode .user-bubble .edit-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            justify-content: flex-end;
        }
        .edit-mode .user-bubble .edit-actions button {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
        }
        .edit-mode .user-bubble .edit-actions .save-edit { background: var(--edit-save-bg); color: var(--edit-save-text); }
        .edit-mode .user-bubble .edit-actions .cancel-edit { background: var(--edit-cancel-bg); color: var(--edit-cancel-text); }

        .user-images-container {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 8px;
            padding: 0 20px;
            justify-content: flex-end;
        }
        .user-images-container img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--divider);
        }

        .file-preview {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding: 6px 0;
        }
        .file-preview .preview-item { position: relative; display: inline-block; }
        .file-preview .preview-item img {
            max-width: 60px;
            max-height: 60px;
            border-radius: 6px;
            object-fit: cover;
            border: 2px solid var(--divider);
        }
        .file-preview .preview-item .remove-file {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--error-color);
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 11px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .model-bubble h1, .model-bubble h2, .model-bubble h3 { margin-top: 0.6em; margin-bottom: 0.3em; font-weight: 600; color: var(--heading-color); }
        .model-bubble h1 { font-size: 1.3em; }
        .model-bubble h2 { font-size: 1.1em; }
        .model-bubble h3 { font-size: 1em; }
        .model-bubble p { margin-bottom: 0.6em; }
        .model-bubble ul, .model-bubble ol { margin-left: 18px; margin-bottom: 0.6em; }
        .model-bubble li { margin-bottom: 0.2em; }
        .model-bubble blockquote { border-left: 3px solid var(--divider); padding-left: 10px; margin: 0.6em 0; color: var(--text-muted); font-style: italic; }
        .model-bubble code:not(pre code) {
            background-color: var(--code-inline-bg);
            padding: 2px 5px;
            border-radius: 6px;
            font-size: 85%;
        }

        .code-block-wrapper {
            margin: 10px 0;
            border: 0.5px solid var(--code-block-border);
            border-radius: 10px;
            overflow: hidden;
            background-color: var(--code-block-bg);
            display: flex;
            flex-direction: column;
        }
        .code-block-wrapper pre {
            background-color: transparent;
            border: none;
            border-radius: 0;
            padding: 14px 18px;
            margin: 0;
            overflow-x: auto;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            line-height: 1.7;
            color: inherit;
        }
        .code-block-wrapper pre code {
            background-color: transparent;
            padding: 0;
            font-family: inherit;
            font-size: inherit;
            color: inherit;
            white-space: pre;
        }
        .code-block-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            background-color: rgba(46,46,46,0.35);
            border-top: 1px solid var(--code-block-border);
            font-family: ui-monospace, monospace;
            font-size: 11px;
            color: var(--text-dim);
        }
        html[data-theme='light'] .code-block-footer {
            background-color: rgba(0,0,0,0.03);
        }
        .code-block-footer .code-lang {
            opacity: 0.7;
            text-transform: lowercase;
            letter-spacing: 0.5px;
        }
        .code-block-footer .copy-code-button {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            background-color: var(--icon-btn-bg);
            border: 1px solid var(--divider);
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 11px;
            font-family: inherit;
            transition: background 0.15s, color 0.15s;
        }
        .code-block-footer .copy-code-button:hover {
            background: var(--icon-btn-hover);
            color: var(--text-primary);

        .dots-btn {
            background: var(--icon-btn-bg);

            border-radius: 50%;

            height: 28px;

        .dots-dropdown {

        .dots-dropdown .dropdown-section-label {

        .dots-dropdown .dropdown-btn {

        .settings-overlay {

        .settings-header {
            display: flex;

            padding: 4px 8px;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 22px;
            line-height: 1;
        }

        .settings-group { margin-bottom: 16px; }

            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 13px;
            color: var(--text-color);
        }
        .settings-group select,
        .settings-group input[type="text"],
        .settings-group input[type="email"],
        .settings-group input[type="password"] {

            border-radius: 6px;
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 14px;
            font-family: inherit;
        }
        .settings-group select:focus,
        .settings-group input:focus { outline: none; border-color: var(--text-dim); }

        .settings-divider {
            border: none;
            border-top: 1px solid var(--divider);

        }

        .auth-form { display: none; flex-direction: column; gap: 10px; }

        .auth-form input {

            padding: 8px 10px;

        .auth-logged-in {

        .auth-logged-in .logout-btn {

            color: var(--text-color);
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
        }
        .auth-logged-in .logout-btn:hover {
            background: var(--logout-hover);
            color: #fff;
            border-color: var(--logout-hover);
        }

        #status {

            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--dropdown-bg);
            border: 1px solid var(--dropdown-border);
            color: var(--text-primary);
            border-radius: 8px;
            padding: 8px 16px;
            display: none;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 16px var(--shadow-color);
            z-index: 1000;
            font-size: 13px;
            max-width: 90%;
        }
        #status.show { display: flex; }
        #status.error { border-color: var(--error-color); color: var(--error-color); }
        #status.warning { border-color: var(--warning-color); color: var(--warning-color); }

        input[type="file"] { display: none; }

        .token-counter {

            align-items: center;
            gap: 4px;

        @media (max-width: 768px) {
            .sidebar {

</head>
<body>

    <aside class="sidebar" id="sidebar">

            const SERVER_STORAGE_URL = '/api/data';

            async function checkServerAvailability() {
                try {

            async function storageGet(key) {
                if (serverAvailable) {
                    try {
                        const response = await fetch(SERVER_STORAGE_URL + '/' + encodeURIComponent(key));
                        if (response.ok) {
                            const data = await response.json();
                            if (data && typeof data.value !== 'undefined') return data.value;
                        }
                    } catch (e) {}
                }
                try {
                    const raw = localStorage.getItem(key);
                    return raw ? JSON.parse(raw) : null;
                } catch (e) { return null; }
            }

            async function storageSet(key, value) {
                if (serverAvailable) {
                    try {
                        const response = await fetch(SERVER_STORAGE_URL + '/' + encodeURIComponent(key), {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ value: value })
                        });
                        if (response.ok) return true;
                    } catch (e) {}
                }
                try {
                    localStorage.setItem(key, JSON.stringify(value));
                    return true;
                } catch (e) { return false; }

                if (serverAvailable) {
                    try {
                        await fetch(SERVER_STORAGE_URL + '/' + encodeURIComponent(key), { method: 'DELETE' });

            let displayBuffer = '';

            let displayMessageIndex = -1;
            let lastFrameTime = 0;
            let streamingBubbleElement = null;

            function startDisplayAnimation(messageIndex) {
                displayMessageIndex = messageIndex;
                if (displayAnimationFrame) cancelAnimationFrame(displayAnimationFrame);
                lastFrameTime = performance.now();

                const cc = elements.chatContent;
                const groups = cc.querySelectorAll('.message-group.model');
                const lastGroup = groups[groups.length - 1];
                streamingBubbleElement = lastGroup ? lastGroup.querySelector('.model-bubble') : null;

                function tick(now) {
                    const delta = now - lastFrameTime;
                    lastFrameTime = now;

                    if (displayBuffer.length < targetBuffer.length) {
                        const remaining = targetBuffer.length - displayBuffer.length;
                        let charsToAdd;

                        if (remaining > 1500) charsToAdd = 250;
                        else if (remaining > 600) charsToAdd = 120;
                        else if (remaining > 250) charsToAdd = 60;
                        else if (remaining > 100) charsToAdd = 30;
                        else if (remaining > 30) charsToAdd = 12;
                        else if (remaining > 10) charsToAdd = 5;
                        else charsToAdd = 2;

                        if (delta > 32) charsToAdd = Math.max(charsToAdd, Math.ceil(remaining * 0.4));
                        if (delta > 60) charsToAdd = remaining;

                        displayBuffer += targetBuffer.slice(displayBuffer.length, displayBuffer.length + charsToAdd);
                        updateStreamingMessage();
                    }
                    displayAnimationFrame = requestAnimationFrame(tick);
                }
                displayAnimationFrame = requestAnimationFrame(tick);
            }

            function stopDisplayAnimation() {
                if (displayAnimationFrame) {
                    cancelAnimationFrame(displayAnimationFrame);
                    displayAnimationFrame = null;
                }
            }

            function wrapPreElements(container) {
                container.querySelectorAll('pre').forEach(pre => {
                    if (pre.closest('.code-block-wrapper')) return;

                    const code = pre.querySelector('code');
                    if (!code) return;

                    let lang = 'code';
                    const match = code.className.match(/language-([\w-]+)/);
                    if (match) lang = match[1];

                    const wrapper = document.createElement('div');
                    wrapper.className = 'code-block-wrapper';

                    const footer = document.createElement('div');
                    footer.className = 'code-block-footer';

                    const langLabel = document.createElement('span');
                    langLabel.className = 'code-lang';
                    langLabel.textContent = lang;

                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'copy-code-button';
                    copyBtn.type = 'button';
                    copyBtn.textContent = 'Copy';

                    copyBtn.addEventListener('click', function() {
                        const textToCopy = code.textContent;
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            navigator.clipboard.writeText(textToCopy).then(() => {
                                copyBtn.textContent = 'Copied!';
                                copyBtn.classList.add('copied');
                                setTimeout(() => {
                                    copyBtn.textContent = 'Copy';
                                    copyBtn.classList.remove('copied');
                                }, 2000);
                            }).catch(() => {
                                fallbackCopy(textToCopy, copyBtn);
                            });
                        } else {
                            fallbackCopy(textToCopy, copyBtn);
                        }
                    });

                    footer.appendChild(langLabel);
                    footer.appendChild(copyBtn);

                    pre.parentNode.insertBefore(wrapper, pre);
                    wrapper.appendChild(pre);
                    wrapper.appendChild(footer);
                });
            }

            function scrollToBottomNow() {
                const c = elements.chatContainer;
                c.scrollTop = c.scrollHeight;
            }

            function updateStreamingMessage() {
                if (!streamingBubbleElement) {
                    const cc = elements.chatContent;
                    const groups = cc.querySelectorAll('.message-group.model');
                    const lastGroup = groups[groups.length - 1];
                    streamingBubbleElement = lastGroup ? lastGroup.querySelector('.model-bubble') : null;
                }
                if (!streamingBubbleElement) return;

                try {
                    const parsed = DOMPurify.sanitize(marked.parse(displayBuffer || ''));
                    streamingBubbleElement.innerHTML = parsed + '<span class="streaming-cursor"></span>';
                    streamingBubbleElement.querySelectorAll('pre code').forEach(block => {
                        try { hljs.highlightElement(block); } catch(e) {}
                    });
                    wrapPreElements(streamingBubbleElement);
                } catch(e) {
                    streamingBubbleElement.textContent = displayBuffer;
                }

                if (state.autoScrollEnabled) {
                    scrollToBottomNow();
                }
            }

            const authDB = {
                users: JSON.parse(localStorage.getItem('nexusai_users') || '{}'),
                sessions: JSON.parse(localStorage.getItem('nexusai_sessions') || '{}'),
                save() {
                    localStorage.setItem('nexusai_users', JSON.stringify(this.users));
                    localStorage.setItem('nexusai_sessions', JSON.stringify(this.sessions));
                },
                register(email, password, name) {
                    const key = email.toLowerCase();
                    if (this.users[key]) return { error: 'Email already registered' };
                    const user = { id: 'user_' + Date.now(), email, name: name || email.split('@')[0], password, provider: 'local', createdAt: new Date().toISOString() };
                    this.users[key] = user; this.save();
                    return { success: true, user };
                },
                login(email, password) {
                    const key = email.toLowerCase();
                    const user = this.users[key];
                    if (!user) return { error: 'User not found' };
                    if (user.provider === 'local' && user.password !== password) return { error: 'Invalid password' };
                    const sessionId = 'sess_' + Date.now();
                    this.sessions[sessionId] = { userId: user.id, email: user.email, createdAt: new Date().toISOString() };
                    this.save();
                    return { success: true, user, sessionId };
                },
                loginWithProvider(provider, email, name, picture) {
                    const key = email.toLowerCase();
                    let user = this.users[key];
                    if (!user) {
                        user = { id: 'user_' + Date.now(), email, name: name || email.split('@')[0], password: '', provider, picture: picture || '', createdAt: new Date().toISOString() };
                        this.users[key] = user;
                    } else {
                        user.provider = provider;
                        if (name) user.name = name;
                        if (picture) user.picture = picture;
                    }
                    const sessionId = 'sess_' + Date.now();
                    this.sessions[sessionId] = { userId: user.id, email: user.email, provider, createdAt: new Date().toISOString() };
                    this.save();
                    return { success: true, user, sessionId };
                },
                logout(sessionId) { delete this.sessions[sessionId]; this.save(); }
            };

            function saveCurrentSession(sessionId) { try { localStorage.setItem('nexusai_current_session', sessionId); } catch(e){} }
            function clearCurrentSession() { try { localStorage.removeItem('nexusai_current_session'); } catch(e){} }
            function restoreSession() {
                try {
                    const sessionId = localStorage.getItem('nexusai_current_session');
                    if (!sessionId) return null;
                    const session = authDB.sessions[sessionId];
                    if (!session) { clearCurrentSession(); return null; }
                    const user = authDB.users[session.email.toLowerCase()];
                    if (!user) { clearCurrentSession(); return null; }
                    return { user, sessionId };
                } catch(e) { return null; }
            }
            function generateId() { return 'conv_' + (++conversationIdCounter) + '_' + Date.now().toString(36); }
            function formatTimestamp(date) {
                const h = date.getHours(), m = date.getMinutes();
                const ampm = h >= 12 ? 'PM' : 'AM';
                return (h % 12 || 12) + ':' + m.toString().padStart(2, '0') + ' ' + ampm;
            }
            function escapeHtml(u) {
                if (typeof u !== 'string') return '';
                return u.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
            }
            function getConversationTitle(messages) {
                if (!messages || messages.length === 0) return 'New Conversation';
                const firstUserMsg = messages.find(m => m.role === 'user');
                if (firstUserMsg) {
                    const text = firstUserMsg.parts.find(p => p.text)?.text || '';
                    return text.slice(0, 40) + (text.length > 40 ? '...' : '');
                }
                return 'New Conversation';
            }
            function getStorageKey() { return state.user ? 'nexusai_data_' + state.user.id : 'nexusai_data_guest'; }

            function getDateGroup(timestamp) {
                const now = new Date();
                const date = new Date(timestamp);
                const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                const startOfYesterday = new Date(startOfToday);
                startOfYesterday.setDate(startOfYesterday.getDate() - 1);
                const sevenDaysAgo = new Date(startOfToday);
                sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
                const thirtyDaysAgo = new Date(startOfToday);
                thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);

                if (date >= startOfToday) return 'Today';
                if (date >= startOfYesterday) return 'Yesterday';
                if (date >= sevenDaysAgo) return 'This week';
                if (date >= thirtyDaysAgo) return 'This month';
                return 'Older';
            }

            async function loadData() {
                try {
                    const data = await storageGet(getStorageKey());
                    if (data) {
                        state.conversations = data.conversations || [];
                        state.activeConversationId = data.activeConversationId || null;
                        state.currentMessages = data.currentMessages || [];
                        state.pinnedConversations = data.pinnedConversations || [];
                        if (data.settings) Object.assign(state.settings, data.settings);
                        if (data.apiKeyIndex !== undefined) state.apiKeyIndex = data.apiKeyIndex;
                        if (data.totalTokensUsed !== undefined) state.totalTokensUsed = data.totalTokensUsed;
                        return true;
                    }
                } catch(e) {}
                return false;
            }

            async function saveData() {
                try {
                    await storageSet(getStorageKey(), {
                        conversations: state.conversations, activeConversationId: state.activeConversationId,
                        currentMessages: state.currentMessages, pinnedConversations: state.pinnedConversations,
                        settings: state.settings, apiKeyIndex: state.apiKeyIndex,
                        totalTokensUsed: state.totalTokensUsed,
                    });
                } catch(e) {}
            }

            }

            function setModel(modelKey) {
                state.settings.model = modelKey;

                    btn.classList.toggle('active', btn.dataset.model === modelKey);

            function estimateTokens(text) {
                if (!text || typeof text !== 'string') return 0;
                return Math.max(1, Math.round(text.length / 4));
            }

            function updateTokenCounter(responseTokens, streaming) {
                if (typeof responseTokens === 'number') {
                    elements.tokenResponse.textContent = responseTokens.toLocaleString();
                }
                elements.tokenTotal.textContent = state.totalTokensUsed.toLocaleString();
                if (streaming) elements.tokenCounter.classList.add('streaming');
                else elements.tokenCounter.classList.remove('streaming');
            }

            function recalculateTotalTokens() {
                let total = 0;
                state.currentMessages.forEach(msg => {
                    if (msg.role === 'user') {
                        msg.parts.forEach(p => {
                            if (p.text) total += estimateTokens(p.text);
                        });
                    } else if (msg.role === 'model') {
                        const text = msg.parts.map(p => p.text || '').join('');
                        total += estimateTokens(text);
                    }
                });
                state.totalTokensUsed = total;
            }

            function forceLandscape() {
                try {
                    if (screen.orientation && typeof screen.orientation.lock === 'function') {
                        screen.orientation.lock('landscape').catch(function() {});
                    }
                } catch(e) {}
            }

            function decodeJwt(token) {
                try {
                    const base64Url = token.split('.')[1];
                    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                    const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                    }).join(''));
                    return JSON.parse(jsonPayload);
                } catch(e) {
                    return null;
                }
            }

            function renderGoogleButton() {
                const container = document.getElementById('googleSignInButton');
                if (!container) return;

                if (typeof google === 'undefined' || !google.accounts || !google.accounts.id) {
                    container.innerHTML = '<div style="font-size:12px; color: var(--text-dim); text-align:center; padding:12px;">Carregando Google...</div>';
                    let attempts = 0;
                    const checkInterval = setInterval(() => {
                        attempts++;
                        if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
                            clearInterval(checkInterval);
                            actuallyRenderGoogleButton(container);
                        } else if (attempts > 40) {
                            clearInterval(checkInterval);
                            container.innerHTML = '<div style="font-size:12px; color: var(--error-color); text-align:center; padding:8px;">Falha ao carregar Google. Verifique a conexão e recarregue.</div>';
                        }
                    }, 250);
                    return;
                }
                actuallyRenderGoogleButton(container);
            }

            function actuallyRenderGoogleButton(container) {
                try {
                    google.accounts.id.initialize({
                        client_id: GOOGLE_CLIENT_ID,
                        callback: function(response) {
                            try {
                                const payload = decodeJwt(response.credential);
                                if (!payload || !payload.email) {
                                    showStatus('Erro ao processar login do Google', true);
                                    return;
                                }
                                const email = payload.email;
                                const name = payload.name || email.split('@')[0];
                                const picture = payload.picture || '';
                                const result = authDB.loginWithProvider('google', email, name, picture);
                                if (result.error) { showStatus(result.error, true); return; }
                                state.user = result.user;
                                saveCurrentSession(result.sessionId);
                                renderAuth(); loadData().then(() => { renderConversations(); renderMessages(); updateTitle(); updateSendButton(); applySettings(); });
                                showStatus('Welcome, ' + state.user.name + '!');
                                closeSettings();
                            } catch(e) {
                                showStatus('Erro no login do Google', true);
                            }
                        }
                    });

                    container.innerHTML = '';
                    google.accounts.id.renderButton(container, {
                        theme: 'outline',
                        size: 'large',
                        text: 'signin_with',
                        shape: 'rectangular',
                        logo_alignment: 'left',
                        width: 300
                    });
                } catch(e) {
                    showStatus('Erro ao carregar botão do Google', true);
                }

            function updateSidebarUserInfo() {

            function renderAuth() {
                updateSidebarUserInfo();

                        <button class="auth-btn" id="registerBtn">Create Account</button>
                    </div>
                `;
                document.querySelectorAll('.auth-tab').forEach(tab => {
                    tab.addEventListener('click', function() {
                        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));

            function handleLogout() {

            function getFilteredConversations() {
                const query = state.searchQuery.toLowerCase().trim();
                if (!query) return state.conversations;
                return state.conversations.filter(conv => {
                    const titleMatch = conv.title.toLowerCase().includes(query);
                    const msgMatch = conv.messages.some(msg => msg.parts.map(p => p.text || '').join('').toLowerCase().includes(query));
                    return titleMatch || msgMatch;
                });
            }

            function renderConversations() {
                const list = elements.conversationsList;
                list.innerHTML = '';
                const filtered = getFilteredConversations();
                if (filtered.length === 0) {
                    const empty = document.createElement('div');
                    empty.style.cssText = 'padding: 16px; text-align: center; color: var(--secondary-color); font-size: 0.85em;';
                    empty.textContent = state.searchQuery ? 'No results found' : 'No conversations yet';
                    list.appendChild(empty);
                    return;
                }

                const pinned = filtered.filter(c => state.pinnedConversations.includes(c.id));
                const unpinned = filtered.filter(c => !state.pinnedConversations.includes(c.id));

                if (pinned.length > 0) {
                    const header = document.createElement('div');
                    header.className = 'conversation-date-header';
                    header.textContent = 'Pinned';
                    list.appendChild(header);
                    pinned.forEach(conv => list.appendChild(buildConversationItem(conv)));
                }

                const groups = {};
                const groupOrder = ['Today', 'Yesterday', 'This week', 'This month', 'Older'];
                unpinned.forEach(conv => {
                    const group = getDateGroup(conv.createdAt || new Date().toISOString());
                    if (!groups[group]) groups[group] = [];
                    groups[group].push(conv);
                });

                groupOrder.forEach(groupName => {
                    if (groups[groupName] && groups[groupName].length > 0) {
                        const header = document.createElement('div');
                        header.className = 'conversation-date-header';
                        header.textContent = groupName;
                        list.appendChild(header);
                        groups[groupName].forEach(conv => list.appendChild(buildConversationItem(conv)));

                renameBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Rename';

                pinBtn.addEventListener('click', e => { e.stopPropagation(); dropdown.classList.remove('open'); togglePinConversation(conv.id); });
                const deleteBtn = document.createElement('button');

                deleteBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/><path d="M10 11v6M14 11v6"/></svg>Delete';
                deleteBtn.addEventListener('click', e => { e.stopPropagation(); dropdown.classList.remove('open'); deleteConversation(conv.id); });

            function renameConversation(id) {
                const conv = state.conversations.find(c => c.id === id);
                if (!conv) return;
                const newTitle = prompt('Enter new title:', conv.title || 'New Conversation');
                if (newTitle !== null && newTitle.trim() !== '') { conv.title = newTitle.trim(); saveData(); renderConversations(); updateTitle(); showStatus('Conversation renamed'); }
            }
            function togglePinConversation(id) {
                const i = state.pinnedConversations.indexOf(id);
                if (i > -1) { state.pinnedConversations.splice(i, 1); showStatus('Conversation unpinned'); }
                else { state.pinnedConversations.push(id); showStatus('Conversation pinned'); }
                saveData(); renderConversations();
            }
            function createNewConversation() {
                const id = generateId();
                state.conversations.unshift({ id, title: 'New Conversation', messages: [], createdAt: new Date().toISOString() });
                state.activeConversationId = id; state.currentMessages = []; state.editingMessageIndex = null;
                state.totalTokensUsed = 0;
                saveData(); renderConversations(); renderMessages(); updateTitle(); updateSendButton();
                updateTokenCounter(0, false);
                showStatus('New conversation created');
                closeSidebarOnMobile();
            }
            function switchConversation(id) {
                const conv = state.conversations.find(c => c.id === id);
                if (!conv) return;
                state.activeConversationId = id; state.currentMessages = conv.messages || []; state.editingMessageIndex = null;
                recalculateTotalTokens();
                saveData(); renderConversations(); renderMessages(); updateTitle(); updateSendButton();
                updateTokenCounter(0, false);
                closeSidebarOnMobile(); scrollToBottom();
            }
            function deleteConversation(id) {
                if (state.conversations.length <= 1) { showStatus('Cannot delete the last conversation', false, true); return; }
                state.conversations = state.conversations.filter(c => c.id !== id);
                state.pinnedConversations = state.pinnedConversations.filter(pid => pid !== id);
                if (state.activeConversationId === id) {
                    const next = state.conversations[0];
                    if (next) { state.activeConversationId = next.id; state.currentMessages = next.messages || []; recalculateTotalTokens(); }
                    else { createNewConversation(); return; }
                }
                saveData(); renderConversations(); renderMessages(); updateTitle(); updateSendButton();
                updateTokenCounter(0, false);
                showStatus('Conversation deleted');
            }
            function updateTitle() {
                const conv = state.conversations.find(c => c.id === state.activeConversationId);
                document.title = (conv ? (conv.title || 'New Conversation') : 'New Conversation') + ' - NexusAI';
            }
            function saveCurrentConversation() {
                const conv = state.conversations.find(c => c.id === state.activeConversationId);
                if (conv) {
                    conv.messages = state.currentMessages;
                    conv.title = getConversationTitle(state.currentMessages) || 'New Conversation';
                    renderConversations(); updateTitle();
                }
                saveData();
            }

            function fallbackCopy(text, button) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    button.textContent = 'Copied!';
                    button.classList.add('copied');
                    setTimeout(() => {
                        button.textContent = 'Copy';
                        button.classList.remove('copied');
                    }, 2000);
                } catch(e) {
                    button.textContent = 'Failed';
                    setTimeout(() => { button.textContent = 'Copy'; }, 2000);
                }

            }

            function renderMessages() {
                const cc = elements.chatContent;
                cc.innerHTML = '';
                streamingBubbleElement = null;
                if (state.currentMessages.length === 0) {
                    cc.innerHTML = `
                        <div class="chat-welcome">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                                <path d="M2 17l10 5 10-5"/>
                                <path d="M2 12l10 5 10-5"/>
                            </svg>
                            NexusAI
                        </div>
                    `;
                    updateScrollButton();
